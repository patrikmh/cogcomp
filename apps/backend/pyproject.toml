[project]
name = "tlon-backend"
version = "0.1.0"
description = "Tlön — a privacy-first Cognitive Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.14",
    "langchain-core>=0.3.28",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    # Graph projection and community clustering. Postgres stays the source of
    # truth; see tlon/graph/graphiti_client.py for the two defaults we override.
    "graphiti-core[falkordb]>=0.29.3",
    # falkordb 1.6.2 passes an async-only connection kwarg to the sync Redis
    # client, which redis 8.x rejects with a TypeError on `himport_registry`.
    # Pinned below 8 until falkordb catches up.
    "redis>=7.1,<8",
]

[project.optional-dependencies]
embeddings = [
    # Local ONNX embeddings for semantic search (ADR-0007). Optional so base
    # deployments and CI never download model weights they will not use.
    "fastembed>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "anyio>=4.6",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["tlon", "tlon.api", "tlon.db", "tlon.domain", "tlon.graph", "tlon.extraction", "tlon.agents"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "SIM", "UP"]
# Depends() in an argument default is the FastAPI idiom, not a mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The full integration run has stalled twice with no failing test — every test
# passes when the same files are run in chunks. A per-test timeout turns the
# next stall into a named culprit instead of a silent 15-minute hang.
timeout = 60
# Thread method: a signal-based kill would take down the whole pytest process
# mid-asyncio, losing which test hung; thread reports and moves on.
timeout_method = "thread"
# Integration tests need a live Postgres; unit tests do not. `-m "not integration"`
# skips the ones that do.
markers = [
    "integration: requires a running Postgres",
    "graph: requires a running FalkorDB",
]
