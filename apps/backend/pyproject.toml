[project]
name = "tlon-backend"
version = "0.1.0"
description = "Tlön — a privacy-first Cognitive Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.14",
    "langchain-core>=0.3.28",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.6",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["tlon", "tlon.api", "tlon.db", "tlon.domain", "tlon.graph", "tlon.extraction"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "SIM", "UP"]
# Depends() in an argument default is the FastAPI idiom, not a mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a live Postgres; unit tests do not. `-m "not integration"`
# skips the ones that do.
markers = ["integration: requires a running Postgres"]
