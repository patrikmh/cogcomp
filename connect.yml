          - region "Appendices" [ref=e704]:
            - generic [ref=e705]:
              - heading "Appendices" [level=2] [ref=e706]
              - generic [ref=e707]:
                - heading "Appendix" [level=3] [ref=e708]
                - heading "Retrieving model-based Networks with ConNEcT" [level=3] [ref=e709]
                - paragraph [ref=e710]:
                  - text: ConNEcT is a widely applicable method for capturing and testing contingency of binary variables across time. It is not based on a particular model specification. Therefore, we expect that it is able to find associations irrespective of which underlying model generated these associations. To demonstrate this, we will apply ConNEcT to binary data that have been generated by published syntaxes. These syntaxes pertain to a latent variable model (Golino & Epskamp,
                  - link "Reference 2017" [ref=e711] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR40
                    - text: "2017"
                  - text: ) and the Curie-Weiss network and sparse network from the article of Epskamp et al. (
                  - link "Reference 2017" [ref=e712] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR31
                    - text: "2017"
                  - text: ). Both models are cross-sectional, as we did not readily find scripts for generating longitudinal binary data.
                - 'heading "1.1 Application 1: Retrieving the Associations Implied by a Latent Variable Model" [level=3] [ref=e713]'
                - paragraph [ref=e714]:
                  - text: As a first example, we use the syntax of Golino and Epskamp (
                  - link "Reference 2017" [ref=e715] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR40
                    - text: "2017"
                  - text: ), who generate binary data from a latent variable model. These authors make use of exploratory graph analysis, as a specific form of network psychometrics that looks for clusters of highly connected variables, to retrieve the latent variable structure. They expect that each latent variable will correspond to a different cluster. Therefore, we will investigate whether applying ConNEcT to such data will also reveal such clusters of highly connected variables.
                - heading "1.1.1 Design of the Simulation Study of Golino and Epskamp" [level=4] [ref=e716]
                - paragraph [ref=e717]: "Number of factors (latent variables): 2, 4"
                - paragraph [ref=e718]: "Number of variables per factor: 5,10"
                - paragraph [ref=e719]: "Number of observations: 100"
                - paragraph [ref=e720]: "Correlation between factors: 0, 0.3, 0.5, 0.7"
                - paragraph [ref=e721]: For details on the data generation procedure, we refer to the original paper. We generated 100 data sets for each of the 16 settings and analyzed each data set with the ConNEcT approach. Note that the data contain no serial dependence as the observations within each dataset were sampled independently.
                - figure "Fig. 7" [ref=e723]:
                  - generic [ref=e725]: Fig. 7
                  - generic [ref=e726]:
                    - generic [ref=e727]:
                      - img "Fig. 7" [ref=e729]
                      - link "Full size image figure 7" [ref=e731] [cursor=pointer]:
                        - /url: /article/10.1007/s11336-021-09765-2/figures/7
                        - text: Full size image
                        - img [ref=e732]
                    - paragraph [ref=e735]: Retrieved ConNEcTs for 16 different latent variable models that imply two factors (upper two rows) or four factors (lower two rows), with 5 (rows 1 and 3) or 10 (row 2 and 4) variables per factor. The intercorrelations among the factors amount to 0 (first column), 0.3 (second column), 0.5 (third column) and 0.7 (last column). Different node colors indicate generation from the same factor. The number of significant links is summarized over all 100 simulated data sets per simulation setting. Dark lines indicate that a link is significant in almost all data sets, while less saturated or thinner links show links that are significant in few data sets only.
                - heading "1.1.2 Settings ConNEcT Significance Test" [level=4] [ref=e736]
                - paragraph [ref=e737]: The scores on each variable were divided into ten segments, which were permuted 100 times. For each combination of two variables, we considered all possible pairs of the corresponding permuted variables, resulting in a sampling distribution of 10,000 Jaccard values.
                - heading "1.1.3 Results" [level=4] [ref=e738]
                - paragraph [ref=e739]:
                  - text: We computed for each variable pair how often its association was significant across the 100 simulated data sets. These results are visualized in the networks in Fig.
                  - link "7" [ref=e740] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#Fig7
                  - text: ", where the width and saturation of the network edges represent how often the associated link was significant. Dark lines therefore indicate a link that is significant in almost all data sets, while less saturated or thinner links show links that are significant in a few data sets only. The networks reveal that the ConNEcT approach indeed retrieves the latent variable models, in that the variables that load strongly on the same underlying factor are densely connected. If the factors are not correlated, we hardly find any links between different clusters (first column). However, the higher the correlations between the factors, the more between-cluster links are found, as could be expected."
                - 'heading "1.2 Application 2: Retrieving the Association Structure of a Curie Weiss Network and a Sparse Network" [level=3] [ref=e741]'
                - paragraph [ref=e742]:
                  - text: In this section, we use the Curie–Weiss and sparse networks that were studied by Epskamp, Kruis and Marsman (
                  - link "Reference 2017" [ref=e743] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR31
                    - text: "2017"
                  - text: see Fig. 1 of their paper). For both networks, we generate 100 data sets, each consisting of 10 variables and 1000 independent observations, and test the significance of each pairwise link with the ConNEcT approach. We used the same test settings as in Study 1.1. The number of significant links across the 100 data sets is shown in Fig.
                  - link "8" [ref=e744] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#Fig8
                  - text: ", revealing that we indeed retrieve the underlying network structures."
                - heading "1.2.1 Results" [level=4] [ref=e745]
                - figure "Fig. 8" [ref=e747]:
                  - generic [ref=e749]: Fig. 8
                  - generic [ref=e750]:
                    - generic [ref=e751]:
                      - img "Fig. 8" [ref=e753]
                      - link "Full size image figure 8" [ref=e755] [cursor=pointer]:
                        - /url: /article/10.1007/s11336-021-09765-2/figures/8
                        - text: Full size image
                        - img [ref=e756]
                    - paragraph [ref=e759]: "Retrieving a a Curie–Weiss network and b a sparse network; 100 data sets were generated each consisting of 10 variables with \\(\\hbox {n}= 1000\\) observations and tested with the ConNEcT approach. Dark lines indicate link that are significant in almost all data sets, while less saturated or thinner links show links that are significant only in few data sets."
                - heading "1.3 Comparison of Model-based and ConNEcT-Based Testing Results" [level=3] [ref=e760]
                - paragraph [ref=e761]:
                  - text: To demonstrate that not accounting for serial dependence in the data indeed leads to type 1 errors, we generated data using the simulation syntaxes of Bodner et al. (
                  - link "Reference 2020" [ref=e762] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR7
                    - text: "2020"
                  - text: "). We twice simulated 100 datasets, that each contain ten independent ‘time series’ of 500 observations. In one setting, the data contain no serial dependence; in the other setting they do. Subsequently, we investigate how often each of the \\(10^{*}9/2=45\\) links between the variables is considered significant by the IsingFit (van Borkulo et al.,"
                  - link "Reference 2014" [ref=e763] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR60
                    - text: "2014"
                  - text: ) and mgm (Haslbeck & Waldorp,
                  - link "Reference 2020" [ref=e764] [cursor=pointer]:
                    - /url: /article/10.1007/s11336-021-09765-2#ref-CR44
                    - text: "2020"
                  - text: ) approaches. As the variables are generated independently, one might naively expect a type 1 error rate (i.e., percentage of false positives) of around 5%. However, we expect that the type 1 error rate will only be reasonable for the data without serial dependence and will be too high for the data with serial dependence. We will compare the results to those of the ConNEcT approach.
                - heading "1.4 Data Generation" [level=3] [ref=e765]
                - paragraph [ref=e766]: "The data were generated by drawing from one or several Bernoulli distributions:"
                - paragraph [ref=e767]: "data were generated by drawing from one or several Bernoulli distributions:"
                - list [ref=e768]:
                  - listitem [ref=e769]:
                    - paragraph [ref=e770]: "For the data without serial dependence, all observations were drawn form a Bernoulli distribution with probability \\(\\hbox {p}_{{1}}=.2\\)."
                  - listitem [ref=e771]:
                    - paragraph [ref=e772]:
                      - text: "For the data with serial dependence, the first observation was again drawn from a Bernoulli distribution with probability \\(\\hbox {p}_{{1}}=.2\\); the following observations were either drawn from a Bernoulli distribution with \\(\\hbox {p}_{{1\\vert 1}} = .9\\), if the previous observation had been a 1 or from a distribution with \\(\\hbox {p}_{{1\\vert 0}} = .025\\) (this value was computed based on the chosen values for \\(\\hbox {p}_{{1}}\\) and \\(\\hbox {p}_{{1\\vert 1}}\\): \\(\\hbox {p}_{{1\\vert 0}}\\) ~(\\(\\hbox {p}_{{1}}\\)-\\({\\hbox {p}_{1}}^{*} \\hbox {p}_{{1\\vert 1}})/(1\\hbox {-}\\hbox {p}_{{1}})\\); see Bodner et al."
                      - link "Reference 2020" [ref=e773] [cursor=pointer]:
                        - /url: /article/10.1007/s11336-021-09765-2#ref-CR7
                        - text: "2020"
                      - text: ).
                - paragraph [ref=e774]: We decided to take data sets of 500 observations, because longer time series will match the chosen prevalence and serial dependence level more exactly. This is especially important, because for both IsingFit and mgm to run smoothly, we need to make sure that there are enough 1s observed (while the IsingFit gives a warning when less than eight 1s are included, the mgm does not give a result if variables contain less than three 1s).
                - heading "1.5 Analysis and Results" [level=3] [ref=e775]
                - paragraph [ref=e776]: "For each method (ConNEcT, IsingFig, mgm) and each data type (with or without serial dependence, we summed the significance results across the 100 simulated data sets. As expected, all three methods perform well, when the data contain no serial dependence:"
                - list [ref=e777]:
                  - listitem [ref=e778]:
                    - paragraph [ref=e779]: "For IsingFit, the type 1 error rate per link never exceeds the nominal level of 5%. The false positive rate ranges between 0 and 0.02 (mean: 0.003), which is actually too small."
                  - listitem [ref=e780]:
                    - paragraph [ref=e781]: "For mgm, the type 1 error rate ranges between .01 and .09 (mean: 0.048), which is quite satisfactory."
                  - listitem [ref=e782]:
                    - paragraph [ref=e783]:
                      - text: "For ConNEcT, we find a type 1 error rate of 0 to 0.07 (mean: .033) (Fig."
                      - link "9" [ref=e784] [cursor=pointer]:
                        - /url: /article/10.1007/s11336-021-09765-2#Fig9
                      - text: ).
                - figure "Fig. 9" [ref=e786]:
                  - generic [ref=e788]: Fig. 9
                  - generic [ref=e789]:
                    - generic [ref=e790]:
                      - img "Fig. 9" [ref=e792]
                      - link "Full size image figure 9" [ref=e794] [cursor=pointer]:
                        - /url: /article/10.1007/s11336-021-09765-2/figures/9
                        - text: Full size image
                        - img [ref=e795]
                    - paragraph [ref=e798]: "Investigating proportion false positives for independent data 1) without serial dependence (first row) and 2) with serial dependence (second row) with a IsingFit, b mgm and c ConNEcT. 100 data sets of 10 independent variables (length n\\(=\\)500) were drawn from 1) Bern(0.2) for the cross-sectional data or 2) time point per time point from a Bernoulli distribution with probability p(\\(\\hbox {X}_{t}=1 | \\hbox {X}_{{t-1}}=1)= .9\\) or p(\\(\\hbox {X}_{t}=1 | \\hbox {X}_{{t-1}}=0) = .025\\) for the time series data."
                - paragraph [ref=e799]: However, the results for the data that contain serial dependence clearly show that taking into account serial dependence matters and that using a method that does not do this yields a too high type 1 error rate.
                - list [ref=e800]:
                  - listitem [ref=e801]:
                    - paragraph [ref=e802]: "For the IsingFit, the type 1 error rate ranges between .36 and .62 (mean: .46)"
                  - listitem [ref=e803]:
                    - paragraph [ref=e804]: "For mgm , the type 1 error ranges between .54 and .75 (mean: .59)"
                  - listitem [ref=e805]:
                    - paragraph [ref=e806]: "For ConNEcT, the type 1 error rate ranges between 0 and 0.12 (mean: 0.05)"
