        - paragraph [ref=e1253]: (Level AA)
        - paragraph [ref=e1254]: "Where receiving and then removing pointer hover or keyboard focus triggers additional content to become visible and then hidden, the following are true:"
        - generic [ref=e1255]:
          - term [ref=e1256]: Dismissible
          - definition [ref=e1257]:
            - text: A
            - link "mechanism" [ref=e1258] [cursor=pointer]:
              - /url: "#dfn-mechanism"
            - text: is available to dismiss the additional content without moving pointer hover or keyboard focus, unless the additional content communicates an
            - link "input error" [ref=e1259] [cursor=pointer]:
              - /url: "#dfn-input-error"
            - text: or does not obscure or replace other content;
          - term [ref=e1260]: Hoverable
          - definition [ref=e1261]: If pointer hover can trigger the additional content, then the pointer can be moved over the additional content without the additional content disappearing;
          - term [ref=e1262]: Persistent
          - definition [ref=e1263]: The additional content remains visible until the hover or focus trigger is removed, the user dismisses it, or its information is no longer valid.
        - paragraph [ref=e1264]:
          - text: "Exception: The visual presentation of the additional content is controlled by the"
          - link "user agent" [ref=e1265] [cursor=pointer]:
            - /url: "#dfn-user-agents"
          - text: and is not modified by the author.
        - note [ref=e1266]:
          - heading "Note 1" [level=5] [ref=e1267]
          - paragraph [ref=e1268]:
            - text: Examples of additional content controlled by the user agent include browser tooltips created through use of the HTML
            - link "title attribute" [ref=e1269] [cursor=pointer]:
              - /url: https://html.spec.whatwg.org/multipage/dom.html#the-title-attribute
              - code [ref=e1270]: title
              - text: attribute
            - text: "["
            - link "HTML" [ref=e1272] [cursor=pointer]:
              - /url: "#bib-html"
            - text: "]."
        - note [ref=e1273]:
          - heading "Note 2" [level=5] [ref=e1274]
          - paragraph [ref=e1275]: Custom tooltips, sub-menus, and other nonmodal popups that display on hover and focus are examples of additional content covered by this criterion.
        - note [ref=e1276]:
          - heading "Note 3" [level=5] [ref=e1277]
          - paragraph [ref=e1278]: This criterion applies to content that appears in addition to the triggering component itself. Since hidden components that are made visible on keyboard focus (such as links used to skip to another part of a page) do not present additional content they are not covered by this criterion.
