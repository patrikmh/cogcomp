          - term [ref=e1420]: Auto-updating
          - definition [ref=e1421]:
            - paragraph [ref=e1422]: For any auto-updating information that (1) starts automatically and (2) is presented in parallel with other content, there is a mechanism for the user to pause, stop, or hide it or to control the frequency of the update unless the auto-updating is part of an activity where it is essential.
        - note [ref=e1423]:
          - heading "Note 1" [level=5] [ref=e1424]
