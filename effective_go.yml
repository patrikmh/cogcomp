          - strong [ref=e2981]: passes
          - text: ") if any of the following are true:"
        - list [ref=e2982]:
          - listitem [ref=e2983]:
            - text: there are no more than three
            - strong [ref=e2984]: general flashes
            - text: and / or no more than three
            - strong [ref=e2985]: red flashes
            - text: within any one-second period; or
          - listitem [ref=e2986]: the combined area of flashes occurring concurrently occupies no more than a total of .006 steradians within any 10 degree visual field on the screen (25% of any 10 degree visual field on the screen) at typical viewing distance
        - paragraph [ref=e2987]: "where:"
        - list [ref=e2988]:
          - listitem [ref=e2989]:
            - text: A
            - strong [ref=e2990]: general flash
            - text: is defined as a pair of opposing changes in
            - link "relative luminance" [ref=e2991] [cursor=pointer]:
              - /url: "#dfn-relative-luminance"
            - text: of 10% or more of the maximum relative luminance (1.0) where the relative luminance of the darker image is below 0.80; and where "a pair of opposing changes" is an increase followed by a decrease, or a decrease followed by an increase, and
          - listitem [ref=e2992]:
            - text: A
            - strong [ref=e2993]: red flash
            - text: is defined as any pair of opposing transitions involving a saturated red
        - paragraph [ref=e2994]:
          - emphasis [ref=e2995]: "Exception:"
          - text: Flashing that is a fine, balanced, pattern such as white noise or an alternating checkerboard pattern with "squares" smaller than 0.1 degree (of visual field at typical viewing distance) on a side does not violate the thresholds.
        - note [ref=e2996]:
          - heading "Note 1" [level=3] [ref=e2997]
          - paragraph [ref=e2998]: For general software or web content, using a 341 x 256 pixel rectangle anywhere on the displayed screen area when the content is viewed at 1024 x 768 pixels will provide a good estimate of a 10 degree visual field for standard screen sizes and viewing distances (e.g., 15-17 inch screen at 22-26 inches). This resolution of 75 - 85 ppi is known to be lower, and thus more conservative than the nominal CSS pixel resolution of 96 ppi in CSS specifications. Higher resolutions displays showing the same rendering of the content yield smaller and safer images so it is lower resolutions that are used to define the thresholds.
        - note [ref=e2999]:
          - heading "Note 2" [level=3] [ref=e3000]
          - paragraph [ref=e3001]: A transition is the change in relative luminance (or relative luminance/color for red flashing) between adjacent peaks and valleys in a plot of relative luminance (or relative luminance/color for red flashing) measurement against time. A flash consists of two opposing transitions.
        - note [ref=e3002]:
          - heading "Note 3" [level=3] [ref=e3003]
          - paragraph [ref=e3004]:
            - text: The new working definition in the field for
            - strong [ref=e3005]: "\"pair of opposing transitions involving a saturated red\""
            - text: (from WCAG 2.2) is a pair of opposing transitions where, one transition is either to or from a state with a value R/(R + G + B) that is greater than or equal to 0.8, and the difference between states is more than 0.2 (unitless) in the CIE 1976 UCS chromaticity diagram. [
            - link "ISO_9241-391" [ref=e3007] [cursor=pointer]:
              - /url: "#bib-iso_9241-391"
            - text: "]"
        - note [ref=e3008]:
          - heading "Note 4" [level=3] [ref=e3009]
          - paragraph [ref=e3010]: "Tools are available that will carry out analysis from video screen capture. However, no tool is necessary to evaluate for this condition if flashing is less than or equal to 3 flashes in any one second. Content automatically passes (see #1 and #2 above)."
      - term [ref=e3011]:
        - term [ref=e3012] [cursor=pointer]: human language
      - definition [ref=e3013]:
        - paragraph [ref=e3014]: language that is spoken, written or signed (through visual or tactile means) to communicate with humans
        - note [ref=e3015]:
          - heading "Note" [level=3] [ref=e3016]
          - paragraph [ref=e3017]:
            - text: See also
            - link "sign language" [ref=e3018] [cursor=pointer]:
              - /url: "#dfn-sign-language"
            - text: .
      - term [ref=e3019]:
        - term [ref=e3020] [cursor=pointer]: idiom
      - definition [ref=e3021]:
        - paragraph [ref=e3022]: phrase whose meaning cannot be deduced from the meaning of the individual words and the specific words cannot be changed without losing the meaning
        - note [ref=e3023]:
          - heading "Note" [level=3] [ref=e3024]
          - paragraph [ref=e3025]: Idioms cannot be translated directly, word for word, without losing their (cultural or language-dependent) meaning.
        - complementary [ref=e3026]:
          - generic [ref=e3027]: Example 1
          - paragraph [ref=e3028]: In English, "spilling the beans" means "revealing a secret." However, "knocking over the beans" or "spilling the vegetables" does not mean the same thing.
        - complementary [ref=e3029]:
          - generic [ref=e3030]: Example 2
          - paragraph [ref=e3031]: In Japanese, the phrase "さじを投げる" literally translates into "he throws a spoon," but it means that there is nothing he can do and finally he gives up.
        - complementary [ref=e3032]:
          - generic [ref=e3033]: Example 3
          - paragraph [ref=e3034]: In Dutch, "Hij ging met de kippen op stok" literally translates into "He went to roost with the chickens," but it means that he went to bed early.
      - term [ref=e3035]:
        - term [ref=e3036] [cursor=pointer]: image of text
      - definition [ref=e3037]:
        - paragraph [ref=e3038]: text that has been rendered in a non-text form (e.g., an image) in order to achieve a particular visual effect
        - note [ref=e3039]:
          - heading "Note" [level=3] [ref=e3040]
          - paragraph [ref=e3041]: This does not include text that is part of a picture that contains significant other visual content.
        - complementary [ref=e3042]:
          - generic [ref=e3043]: Example
          - paragraph [ref=e3044]: A person's name on a nametag in a photograph.
      - term [ref=e3045]:
        - term [ref=e3046] [cursor=pointer]: informative
      - definition [ref=e3047]:
        - paragraph [ref=e3048]: for information purposes and not required for conformance
        - note [ref=e3049]:
          - heading "Note" [level=3] [ref=e3050]
          - paragraph [ref=e3051]:
            - text: Content required for
            - link "conformance" [ref=e3052] [cursor=pointer]:
              - /url: "#dfn-conform"
            - text: is referred to as "
            - link "normative" [ref=e3053] [cursor=pointer]:
              - /url: "#dfn-normative"
            - text: ."
      - term [ref=e3054]:
        - term [ref=e3055] [cursor=pointer]: input error
      - definition [ref=e3056]:
        - paragraph [ref=e3057]: information provided by the user that is not accepted
        - note [ref=e3058]:
          - heading "Note" [level=3] [ref=e3059]
          - generic [ref=e3060]:
            - paragraph [ref=e3061]: "This includes:"
            - list [ref=e3062]:
              - listitem [ref=e3063]:
                - text: Information that is required by the
                - link "web page" [ref=e3064] [cursor=pointer]:
                  - /url: "#dfn-web-page-s"
                - text: but omitted by the user
              - listitem [ref=e3065]: Information that is provided by the user but that falls outside the required data format or values
      - term [ref=e3066]:
        - term [ref=e3067] [cursor=pointer]: jargon
      - definition [ref=e3068]:
        - paragraph [ref=e3069]: words used in a particular way by people in a particular field
        - complementary [ref=e3070]:
          - generic [ref=e3071]: Example
          - paragraph [ref=e3072]: The word StickyKeys is jargon from the field of assistive technology/accessibility.
      - term [ref=e3073]:
        - term [ref=e3074] [cursor=pointer]: keyboard interface
      - definition [ref=e3075]:
        - paragraph [ref=e3076]: interface used by software to obtain keystroke input
        - note [ref=e3077]:
          - heading "Note 1" [level=3] [ref=e3078]
          - generic [ref=e3079]:
            - paragraph [ref=e3080]: A keyboard interface allows users to provide keystroke input to programs even if the native technology does not contain a keyboard.
            - complementary [ref=e3081]:
              - generic [ref=e3082]: Example
              - paragraph [ref=e3083]: A touchscreen PDA has a keyboard interface built into its operating system as well as a connector for external keyboards. Applications on the PDA can use the interface to obtain keyboard input either from an external keyboard or from other applications that provide simulated keyboard output, such as handwriting interpreters or speech-to-text applications with "keyboard emulation" functionality.
        - note [ref=e3084]:
          - heading "Note 2" [level=3] [ref=e3085]
          - paragraph [ref=e3086]: Operation of the application (or parts of the application) through a keyboard-operated mouse emulator, such as MouseKeys, does not qualify as operation through a keyboard interface because operation of the program is through its pointing device interface, not through its keyboard interface.
      - term [ref=e3087]:
        - term [ref=e3088] [cursor=pointer]: keyboard shortcut
      - definition [ref=e3089]:
        - paragraph [ref=e3090]: alternative means of triggering an action by the pressing of one or more keys
      - term [ref=e3091]:
        - term [ref=e3092] [cursor=pointer]: label
      - definition [ref=e3093]:
        - paragraph [ref=e3094]:
          - link "text" [ref=e3095] [cursor=pointer]:
            - /url: "#dfn-text"
          - text: or other component with a
          - link "text alternative" [ref=e3096] [cursor=pointer]:
            - /url: "#dfn-text-alternative"
          - text: that is presented to a user to identify a component within web
          - link "content" [ref=e3097] [cursor=pointer]:
            - /url: "#dfn-content"
        - note [ref=e3098]:
          - heading "Note 1" [level=3] [ref=e3099]
          - paragraph [ref=e3100]:
            - text: A label is presented to all users whereas the
            - link "name" [ref=e3101] [cursor=pointer]:
              - /url: "#dfn-name"
            - text: may be hidden and only exposed by assistive technology. In many (but not all) cases the name and the label are the same.
        - note [ref=e3102]:
          - heading "Note 2" [level=3] [ref=e3103]
          - paragraph [ref=e3104]: The term label is not limited to the label element in HTML.
      - term [ref=e3105]:
        - term [ref=e3106] [cursor=pointer]: large scale
        - text: (text)
      - definition [ref=e3107]:
        - paragraph [ref=e3108]: with at least 18 point or 14 point bold or font size that would yield equivalent size for Chinese, Japanese and Korean (CJK) fonts
        - note [ref=e3109]:
          - heading "Note 1" [level=3] [ref=e3110]
          - paragraph [ref=e3111]: Fonts with extraordinarily thin strokes or unusual features and characteristics that reduce the familiarity of their letter forms are harder to read, especially at lower contrast levels.
        - note [ref=e3112]:
          - heading "Note 2" [level=3] [ref=e3113]
          - paragraph [ref=e3114]: Font size is the size when the content is delivered. It does not include resizing that may be done by a user.
        - note [ref=e3115]:
          - heading "Note 3" [level=3] [ref=e3116]
          - paragraph [ref=e3117]: The actual size of the character that a user sees is dependent both on the author-defined size and the user's display or user agent settings. For many mainstream body text fonts, 14 and 18 point is roughly equivalent to 1.2 and 1.5 em or to 120% or 150% of the default size for body text (assuming that the body font is 100%), but authors would need to check this for the particular fonts in use. When fonts are defined in relative units, the actual point size is calculated by the user agent for display. The point size should be obtained from the user agent, or calculated based on font metrics as the user agent does, when evaluating this success criterion. Users who have low vision would be responsible for choosing appropriate settings.
        - note [ref=e3118]:
          - heading "Note 4" [level=3] [ref=e3119]
          - paragraph [ref=e3120]: When using text without specifying the font size, the smallest font size used on major browsers for unspecified text would be a reasonable size to assume for the font. If a level 1 heading is rendered in 14pt bold or higher on major browsers, then it would be reasonable to assume it is large text. Relative scaling can be calculated from the default sizes in a similar fashion.
        - note [ref=e3121]:
          - heading "Note 5" [level=3] [ref=e3122]
          - paragraph [ref=e3123]: The 18 and 14 point sizes for roman texts are taken from the minimum size for large print (14pt) and the larger standard font size (18pt). For other fonts such as CJK languages, the "equivalent" sizes would be the minimum large print size used for those languages and the next larger standard large print size.
      - term [ref=e3124]:
        - term [ref=e3125] [cursor=pointer]: legal commitments
      - definition [ref=e3126]:
        - paragraph [ref=e3127]: transactions where the person incurs a legally binding obligation or benefit
        - complementary [ref=e3128]:
          - generic [ref=e3129]: Example
          - paragraph [ref=e3130]: A marriage license, a stock trade (financial and legal), a will, a loan, adoption, signing up for the army, a contract of any type, etc.
      - term [ref=e3131]:
        - term [ref=e3132] [cursor=pointer]: link purpose
      - definition [ref=e3133]:
        - paragraph [ref=e3134]: nature of the result obtained by activating a hyperlink
      - term [ref=e3135]:
        - term [ref=e3136] [cursor=pointer]: live
      - definition [ref=e3137]:
        - paragraph [ref=e3138]: information captured from a real-world event and transmitted to the receiver with no more than a broadcast delay
        - note [ref=e3139]:
          - heading "Note 1" [level=3] [ref=e3140]
          - paragraph [ref=e3141]: A broadcast delay is a short (usually automated) delay, for example used in order to give the broadcaster time to cue or censor the audio (or video) feed, but not sufficient to allow significant editing.
        - note [ref=e3142]:
          - heading "Note 2" [level=3] [ref=e3143]
          - paragraph [ref=e3144]: If information is completely computer generated, it is not live.
      - term [ref=e3145]:
        - term [ref=e3146] [cursor=pointer]: lower secondary education level
      - definition [ref=e3147]:
        - paragraph [ref=e3148]:
          - text: the two or three year period of education that begins after completion of six years of school and ends nine years after the beginning of
          - link "primary education" [ref=e3149] [cursor=pointer]:
            - /url: "#dfn-primary-education"
        - note [ref=e3150]:
          - heading "Note" [level=3] [ref=e3151]
          - paragraph [ref=e3152]:
            - text: This definition is based on the International Standard Classification of Education [
            - link "UNESCO" [ref=e3154] [cursor=pointer]:
              - /url: "#bib-unesco"
            - text: "]."
      - term [ref=e3155]:
        - term [ref=e3156] [cursor=pointer]: mechanism
      - definition [ref=e3157]:
        - paragraph [ref=e3158]:
          - link "process" [ref=e3159] [cursor=pointer]:
            - /url: "#dfn-processes"
          - text: or technique for achieving a result
        - note [ref=e3160]:
          - heading "Note 1" [level=3] [ref=e3161]
          - paragraph [ref=e3162]:
            - text: The mechanism may be explicitly provided in the content, or may be
            - link "relied upon" [ref=e3163] [cursor=pointer]:
              - /url: "#dfn-relied-upon"
            - text: to be provided by either the platform or by
            - link "user agents" [ref=e3164] [cursor=pointer]:
              - /url: "#dfn-user-agents"
            - text: ", including"
            - link "assistive technologies" [ref=e3165] [cursor=pointer]:
              - /url: "#dfn-assistive-technologies"
            - text: .
        - note [ref=e3166]:
          - heading "Note 2" [level=3] [ref=e3167]
          - paragraph [ref=e3168]: The mechanism needs to meet all success criteria for the conformance level claimed.
      - term [ref=e3169]:
        - term [ref=e3170] [cursor=pointer]: media alternative for text
      - definition [ref=e3171]:
        - paragraph [ref=e3172]: media that presents no more information than is already presented in text (directly or via text alternatives)
        - note [ref=e3173]:
          - heading "Note" [level=3] [ref=e3174]
          - paragraph [ref=e3175]: A media alternative for text is provided for those who benefit from alternate representations of text. Media alternatives for text may be audio-only, video-only (including sign-language video), or audio-video.
      - term [ref=e3176]:
        - term [ref=e3177] [cursor=pointer]: motion animation
      - definition [ref=e3178]:
        - paragraph [ref=e3179]: addition of steps between conditions to create the illusion of movement or to give a sense of a smooth transition
        - complementary [ref=e3180]:
          - generic [ref=e3181]: Example
          - paragraph [ref=e3182]: For example, an element which moves into place or changes size while appearing is considered to be animated. An element which appears instantly without transitioning is not using animation. Motion animation does not include changes of color, blurring, or opacity which do not change the perceived size, shape, or position of the element.
      - term [ref=e3183]:
        - term [ref=e3184] [cursor=pointer]: minimum bounding box
      - definition [ref=e3185]:
        - paragraph [ref=e3186]: New
        - paragraph [ref=e3187]:
          - text: the smallest enclosing rectangle aligned to the horizontal axis within which all the points of a shape lie. For components which wrap onto multiple lines as part of a sentence or
          - link "block of text" [ref=e3188] [cursor=pointer]:
            - /url: "#dfn-blocks-of-text"
          - text: (such as hypertext links), the bounding box is based on how the component would appear on a single line.
      - term [ref=e3189]:
        - term [ref=e3190] [cursor=pointer]: name
      - definition [ref=e3191]:
        - paragraph [ref=e3192]: text by which software can identify a component within web content to the user
        - note [ref=e3193]:
          - heading "Note 1" [level=3] [ref=e3194]
          - paragraph [ref=e3195]:
            - text: The name may be hidden and only exposed by assistive technology, whereas a
            - link "label" [ref=e3196] [cursor=pointer]:
              - /url: "#dfn-labels"
            - text: is presented to all users. In many (but not all) cases, the label and the name are the same.
        - note [ref=e3197]:
          - heading "Note 2" [level=3] [ref=e3198]
          - paragraph [ref=e3199]: This is unrelated to the name attribute in HTML.
      - term [ref=e3200]:
        - term [ref=e3201] [cursor=pointer]: navigated sequentially
      - definition [ref=e3202]:
        - paragraph [ref=e3203]:
          - text: navigated in the order defined for advancing focus (from one element to the next) using a
          - link "keyboard interface" [ref=e3204] [cursor=pointer]:
            - /url: "#dfn-keyboard-interface"
      - term [ref=e3205]:
        - term [ref=e3206] [cursor=pointer]: non-text content
      - definition [ref=e3207]:
        - paragraph [ref=e3208]:
          - text: any content that is not a sequence of characters that can be
          - link "programmatically determined" [ref=e3209] [cursor=pointer]:
            - /url: "#dfn-programmatically-determinable"
          - text: or where the sequence is not expressing something in
          - link "human language" [ref=e3210] [cursor=pointer]:
            - /url: "#dfn-human-language-s"
        - note [ref=e3211]:
          - heading "Note" [level=3] [ref=e3212]
          - paragraph [ref=e3213]:
            - text: This includes
            - link "ASCII art" [ref=e3214] [cursor=pointer]:
              - /url: "#dfn-ascii-art"
            - text: (which is a pattern of characters), emoticons, leetspeak (which uses character substitution), and images representing text
      - term [ref=e3215]:
        - term [ref=e3216] [cursor=pointer]: normative
      - definition [ref=e3217]:
        - paragraph [ref=e3218]: required for conformance
        - note [ref=e3219]:
          - heading "Note 1" [level=3] [ref=e3220]
          - paragraph [ref=e3221]: One may conform in a variety of well-defined ways to this document.
        - note [ref=e3222]:
          - heading "Note 2" [level=3] [ref=e3223]
          - paragraph [ref=e3224]:
            - text: Content identified as "
            - link "informative" [ref=e3225] [cursor=pointer]:
              - /url: "#dfn-informative"
            - text: "\" or \"non-normative\" is never required for"
            - link "conformance" [ref=e3226] [cursor=pointer]:
              - /url: "#dfn-conform"
            - text: .
      - term [ref=e3227]:
        - term [ref=e3228] [cursor=pointer]: on a full-screen window
      - definition [ref=e3229]:
        - paragraph [ref=e3230]:
          - text: on the most common sized desktop/laptop display with the
          - link "viewport" [ref=e3231] [cursor=pointer]:
            - /url: "#dfn-viewport"
          - text: maximized
        - note [ref=e3232]:
          - heading "Note" [level=3] [ref=e3233]
          - paragraph [ref=e3234]: Since people generally keep their computers for several years, it is best not to rely on the latest desktop/laptop display resolutions but to consider the common desktop/laptop display resolutions over the course of several years when making this evaluation.
      - term [ref=e3235]:
        - term [ref=e3236] [cursor=pointer]: paused
      - definition [ref=e3237]:
        - paragraph [ref=e3238]: stopped by user request and not resumed until requested by user
      - term [ref=e3239]:
        - term [ref=e3240] [cursor=pointer]: perimeter
      - definition [ref=e3241]:
        - paragraph [ref=e3242]: New
        - paragraph [ref=e3243]:
          - text: continuous line forming the boundary of a shape not including shared pixels, or the
          - link "minimum bounding box" [ref=e3244] [cursor=pointer]:
            - /url: "#dfn-bounding-boxes"
          - text: ", whichever is shortest."
        - complementary [ref=e3245]:
          - generic [ref=e3246]: Example
          - paragraph [ref=e3247]:
            - text: The perimeter calculation for a 2 CSS pixel perimeter around a rectangle is 4
            - emphasis [ref=e3248]: h
            - text: "+4"
            - emphasis [ref=e3249]: w
            - text: ", where"
            - emphasis [ref=e3250]: h
            - text: is the height and
            - emphasis [ref=e3251]: w
            - text: is the width. For a 2 CSS pixel perimeter around a circle it is 4𝜋
            - emphasis [ref=e3252]: r
            - text: .
      - term [ref=e3253]:
        - term [ref=e3254] [cursor=pointer]: pointer input
      - definition [ref=e3255]:
        - paragraph [ref=e3256]: input from a device that can target a specific coordinate (or set of coordinates) on a screen, such as a mouse, pen, or touch contact
        - note [ref=e3257]:
          - heading "Note" [level=3] [ref=e3258]
          - paragraph [ref=e3259]:
            - text: See the
            - link "Pointer Events definition for \"pointer\"" [ref=e3260] [cursor=pointer]:
              - /url: https://www.w3.org/TR/pointerevents/#dfn-pointer
            - text: "["
            - link "pointerevents" [ref=e3262] [cursor=pointer]:
              - /url: "#bib-pointerevents"
            - text: "]."
      - term [ref=e3263]:
        - term [ref=e3264] [cursor=pointer]: prerecorded
      - definition [ref=e3265]:
        - paragraph [ref=e3266]:
          - text: information that is not
          - link "live" [ref=e3267] [cursor=pointer]:
            - /url: "#dfn-live"
      - term [ref=e3268]:
        - term [ref=e3269] [cursor=pointer]: presentation
      - definition [ref=e3270]:
        - paragraph [ref=e3271]:
          - text: rendering of the
          - link "content" [ref=e3272] [cursor=pointer]:
            - /url: "#dfn-content"
          - text: in a form to be perceived by users
      - term [ref=e3273]:
        - term [ref=e3274] [cursor=pointer]: primary education level
      - definition [ref=e3275]:
        - paragraph [ref=e3276]: six year time period that begins between the ages of five and seven, possibly without any previous education
        - note [ref=e3277]:
          - heading "Note" [level=3] [ref=e3278]
          - paragraph [ref=e3279]:
            - text: This definition is based on the International Standard Classification of Education [
            - link "UNESCO" [ref=e3281] [cursor=pointer]:
              - /url: "#bib-unesco"
            - text: "]."
      - term [ref=e3282]:
        - term [ref=e3283] [cursor=pointer]: process
      - definition [ref=e3284]:
        - paragraph [ref=e3285]: series of user actions where each action is required in order to complete an activity
        - complementary [ref=e3286]:
          - generic [ref=e3287]: Example 1
          - paragraph [ref=e3288]: Successful use of a series of web pages on a shopping site requires users to view alternative products, prices and offers, select products, submit an order, provide shipping information and provide payment information.
        - complementary [ref=e3289]:
          - generic [ref=e3290]: Example 2
          - paragraph [ref=e3291]:
            - text: An account registration page requires successful completion of a
            - link "Turing test" [ref=e3292] [cursor=pointer]:
              - /url: https://www.w3.org/TR/turingtest/
            - text: before the registration form can be accessed.
      - term [ref=e3293]:
        - term [ref=e3294] [cursor=pointer]: programmatically determined
        - text: (programmatically determinable)
      - definition [ref=e3295]:
        - paragraph [ref=e3296]:
          - text: determined by software from author-supplied data provided in a way that different
          - link "user agents" [ref=e3297] [cursor=pointer]:
            - /url: "#dfn-user-agents"
          - text: ", including"
          - link "assistive technologies" [ref=e3298] [cursor=pointer]:
            - /url: "#dfn-assistive-technologies"
          - text: ", can extract and present this information to users in different modalities"
        - complementary [ref=e3299]:
          - generic [ref=e3300]: Example 1
          - paragraph [ref=e3301]: Determined in a markup language from elements and attributes that are accessed directly by commonly available assistive technology.
        - complementary [ref=e3302]:
          - generic [ref=e3303]: Example 2
          - paragraph [ref=e3304]: Determined from technology-specific data structures in a non-markup language and exposed to assistive technology via an accessibility API that is supported by commonly available assistive technology.
      - term [ref=e3305]:
        - term [ref=e3306] [cursor=pointer]: programmatically determined link context
      - definition [ref=e3307]:
        - paragraph [ref=e3308]:
          - text: additional information that can be
          - link "programmatically determined" [ref=e3309] [cursor=pointer]:
            - /url: "#dfn-programmatically-determinable"
          - text: from
          - link "relationships" [ref=e3310] [cursor=pointer]:
            - /url: "#dfn-relationships"
          - text: with a link, combined with the link text, and presented to users in different modalities
        - complementary [ref=e3311]:
          - generic [ref=e3312]: Example
          - paragraph [ref=e3313]:
            - text: In HTML, information that is programmatically determinable from a link in English includes text that is in the same
            - link "paragraph" [ref=e3314] [cursor=pointer]:
              - /url: https://html.spec.whatwg.org/multipage/dom.html#paragraph
            - text: ", list item, or table cell as the link or in a table header cell that is associated with the table cell that contains the link."
        - note [ref=e3315]:
          - heading "Note" [level=3] [ref=e3316]
          - paragraph [ref=e3317]: Since screen readers interpret punctuation, they can also provide the context from the current sentence, when the focus is on a link in that sentence.
      - term [ref=e3318]:
        - term [ref=e3319] [cursor=pointer]: programmatically set
      - definition [ref=e3320]:
        - paragraph [ref=e3321]:
          - text: set by software using methods that are supported by
          - link "user agents" [ref=e3322] [cursor=pointer]:
            - /url: "#dfn-user-agents"
          - text: ", including"
          - link "assistive technologies" [ref=e3323] [cursor=pointer]:
            - /url: "#dfn-assistive-technologies"
      - term [ref=e3324]:
        - term [ref=e3325] [cursor=pointer]: pure decoration
      - definition [ref=e3326]:
        - paragraph [ref=e3327]: serving only an aesthetic purpose, providing no information, and having no functionality
        - note [ref=e3328]:
          - heading "Note" [level=3] [ref=e3329]
          - paragraph [ref=e3330]: Text is only purely decorative if the words can be rearranged or substituted without changing their purpose.
        - complementary [ref=e3331]:
          - generic [ref=e3332]: Example
          - paragraph [ref=e3333]: The cover page of a dictionary has random words in very light text in the background.
      - term [ref=e3334]:
        - term [ref=e3335] [cursor=pointer]: real-time event
      - definition [ref=e3336]:
        - paragraph [ref=e3337]: event that a) occurs at the same time as the viewing and b) is not completely generated by the content
        - complementary [ref=e3338]:
          - generic [ref=e3339]: Example 1
          - paragraph [ref=e3340]: A Webcast of a live performance (occurs at the same time as the viewing and is not prerecorded).
        - complementary [ref=e3341]:
          - generic [ref=e3342]: Example 2
          - paragraph [ref=e3343]: An on-line auction with people bidding (occurs at the same time as the viewing).
        - complementary [ref=e3344]:
          - generic [ref=e3345]: Example 3
          - paragraph [ref=e3346]: Live humans interacting in a virtual world using avatars (is not completely generated by the content and occurs at the same time as the viewing).
      - term [ref=e3347]:
        - term [ref=e3348] [cursor=pointer]: region
      - definition [ref=e3349]:
        - paragraph [ref=e3350]:
          - text: perceivable,
          - link "programmatically determined" [ref=e3351] [cursor=pointer]:
            - /url: "#dfn-programmatically-determinable"
          - link "section" [ref=e3352] [cursor=pointer]:
            - /url: "#dfn-section"
          - text: of content
        - note [ref=e3353]:
          - heading "Note" [level=3] [ref=e3354]
          - paragraph [ref=e3355]: In HTML, any area designated with a landmark role would be a region.
      - term [ref=e3356]:
        - term [ref=e3357] [cursor=pointer]: relationships
      - definition [ref=e3358]:
        - paragraph [ref=e3359]: meaningful associations between distinct pieces of content
      - term [ref=e3360]:
        - term [ref=e3361] [cursor=pointer]: relative luminance
      - definition [ref=e3362]:
        - paragraph [ref=e3363]: the relative brightness of any point in a colorspace, normalized to 0 for darkest black and 1 for lightest white
        - note [ref=e3364]:
          - heading "Note 1" [level=3] [ref=e3365]
          - generic [ref=e3366]:
            - paragraph [ref=e3367]:
              - text: For the sRGB colorspace, the relative luminance of a color is defined as L = 0.2126 *
              - strong [ref=e3368]: R
              - text: + 0.7152 *
              - strong [ref=e3369]: G
              - text: + 0.0722 *
              - strong [ref=e3370]: B
              - text: where
              - strong [ref=e3371]: R
              - text: ","
              - strong [ref=e3372]: G
              - text: and
              - strong [ref=e3373]: B
              - text: "are defined as:"
            - list [ref=e3374]:
              - listitem [ref=e3375]:
                - text: if RsRGB <= 0.04045 then
                - strong [ref=e3376]: R
                - text: = RsRGB/12.92 else
                - strong [ref=e3377]: R
                - text: = ((RsRGB+0.055)/1.055) ^ 2.4
              - listitem [ref=e3378]:
                - text: if GsRGB <= 0.04045 then
                - strong [ref=e3379]: G
                - text: = GsRGB/12.92 else
                - strong [ref=e3380]: G
                - text: = ((GsRGB+0.055)/1.055) ^ 2.4
              - listitem [ref=e3381]:
                - text: if BsRGB <= 0.04045 then
                - strong [ref=e3382]: B
                - text: = BsRGB/12.92 else
                - strong [ref=e3383]: B
                - text: = ((BsRGB+0.055)/1.055) ^ 2.4
            - paragraph [ref=e3384]: "and RsRGB, GsRGB, and BsRGB are defined as:"
            - list [ref=e3385]:
              - listitem [ref=e3386]: RsRGB = R8bit/255
              - listitem [ref=e3387]: GsRGB = G8bit/255
              - listitem [ref=e3388]: BsRGB = B8bit/255
            - paragraph [ref=e3389]:
              - text: The "^" character is the exponentiation operator. (Formula taken from [
              - link "SRGB" [ref=e3391] [cursor=pointer]:
                - /url: "#bib-srgb"
              - text: "].)"
        - note [ref=e3392]:
          - heading "Note 2" [level=3] [ref=e3393]
          - paragraph [ref=e3394]: Before May 2021 the value of 0.04045 in the definition was different (0.03928). It was taken from an older version of the specification and has been updated. It has no practical effect on the calculations in the context of these guidelines.
        - note [ref=e3395]:
          - heading "Note 3" [level=3] [ref=e3396]
          - paragraph [ref=e3397]:
            - text: Almost all systems used today to view web content assume sRGB encoding. Unless it is known that another color space will be used to process and display the content, authors should evaluate using sRGB colorspace. If using other color spaces, see
            - link "Understanding Success Criterion 1.4.3" [ref=e3398] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum
            - text: .
        - note [ref=e3399]:
          - heading "Note 4" [level=3] [ref=e3400]
          - paragraph [ref=e3401]: If dithering occurs after delivery, then the source color value is used. For colors that are dithered at the source, the average values of the colors that are dithered should be used (average R, average G, and average B).
        - note [ref=e3402]:
          - heading "Note 5" [level=3] [ref=e3403]
          - paragraph [ref=e3404]: Tools are available that automatically do the calculations when testing contrast and flash.
        - note [ref=e3405]:
          - heading "Note 6" [level=3] [ref=e3406]
          - paragraph [ref=e3407]:
            - text: A
            - link "separate page giving the relative luminance definition using MathML" [ref=e3408] [cursor=pointer]:
              - /url: relative-luminance.html
            - text: to display the formulas is available.
      - term [ref=e3409]:
        - term [ref=e3410] [cursor=pointer]: relied upon
        - text: (technologies that are)
      - definition [ref=e3411]:
        - paragraph [ref=e3412]:
          - text: the content would not
          - link "conform" [ref=e3413] [cursor=pointer]:
            - /url: "#dfn-conform"
          - text: if that
          - link "technology" [ref=e3414] [cursor=pointer]:
            - /url: "#dfn-technologies"
          - text: is turned off or is not supported
      - term [ref=e3415]:
        - term [ref=e3416] [cursor=pointer]: role
      - definition [ref=e3417]:
        - paragraph [ref=e3418]: text or number by which software can identify the function of a component within Web content
        - complementary [ref=e3419]:
          - generic [ref=e3420]: Example
          - paragraph [ref=e3421]: A number that indicates whether an image functions as a hyperlink, command button, or check box.
      - term [ref=e3422]:
        - term [ref=e3423] [cursor=pointer]: same functionality
      - definition [ref=e3424]:
        - paragraph [ref=e3425]: same result when used
        - complementary [ref=e3426]:
          - generic [ref=e3427]: Example
          - paragraph [ref=e3428]: A submit "search" button on one web page and a "find" button on another web page may both have a field to enter a term and list topics in the website related to the term submitted. In this case, they would have the same functionality but would not be labeled consistently.
      - term [ref=e3429]:
        - term [ref=e3430] [cursor=pointer]: same relative order
      - definition [ref=e3431]:
        - paragraph [ref=e3432]: same position relative to other items
        - note [ref=e3433]:
          - heading "Note" [level=3] [ref=e3434]
          - paragraph [ref=e3435]: Items are considered to be in the same relative order even if other items are inserted or removed from the original order. For example, expanding navigation menus may insert an additional level of detail or a secondary navigation section may be inserted into the reading order.
      - term [ref=e3436]:
        - term [ref=e3437] [cursor=pointer]: satisfies a success criterion
      - definition [ref=e3438]:
        - paragraph [ref=e3439]: the success criterion does not evaluate to 'false' when applied to the page
      - term [ref=e3440]:
        - term [ref=e3441] [cursor=pointer]: section
      - definition [ref=e3442]:
        - paragraph [ref=e3443]: a self-contained portion of written content that deals with one or more related topics or thoughts
        - note [ref=e3444]:
          - heading "Note" [level=3] [ref=e3445]
          - paragraph [ref=e3446]: A section may consist of one or more paragraphs and include graphics, tables, lists and sub-sections.
      - term [ref=e3447]:
        - term [ref=e3448] [cursor=pointer]: set of web pages
      - definition [ref=e3449]:
        - paragraph [ref=e3450]:
          - text: collection of
          - link "web pages" [ref=e3451] [cursor=pointer]:
            - /url: "#dfn-web-page-s"
          - text: that share a common purpose and that are created by the same author, group or organization
        - complementary [ref=e3452]:
          - generic [ref=e3453]: Example
          - paragraph [ref=e3454]: "Examples include:"
          - list [ref=e3455]:
            - listitem [ref=e3456]: a publication which is split across multiple web pages, where each page contains one chapter or other significant section of the work. The publication is logically a single contiguous unit, and contains navigation features that enable access to the full set of pages.
            - listitem [ref=e3457]: an e-commerce website shows products in a set of web pages that all share the same navigation and identification. However, when progressing to the checkout process, the template changes; the navigation and other elements are removed, so the pages in that process are functionally and visually different. The checkout pages are not part of the set of product pages.
            - listitem [ref=e3458]: a blog on a sub-domain (e.g. blog.example.com) which has a different navigation and is authored by a distinct set of people from the pages on the primary domain (example.com).
        - note [ref=e3459]:
          - heading "Note" [level=3] [ref=e3460]
          - paragraph [ref=e3461]: Different language versions would be considered different sets of web pages.
      - term [ref=e3462]:
        - term [ref=e3463] [cursor=pointer]: sign language
      - definition [ref=e3464]:
        - paragraph [ref=e3465]: a language using combinations of movements of the hands and arms, facial expressions, or body positions to convey meaning
      - term [ref=e3466]:
        - term [ref=e3467] [cursor=pointer]: sign language interpretation
      - definition [ref=e3468]:
        - paragraph [ref=e3469]:
          - text: translation of one language, generally a spoken language, into a
          - link "sign language" [ref=e3470] [cursor=pointer]:
            - /url: "#dfn-sign-language"
        - note [ref=e3471]:
          - heading "Note" [level=3] [ref=e3472]
          - paragraph [ref=e3473]: True sign languages are independent languages that are unrelated to the spoken language(s) of the same country or region.
      - term [ref=e3474]:
        - term [ref=e3475] [cursor=pointer]: single pointer
      - definition [ref=e3476]:
        - paragraph [ref=e3477]: an input modality that only targets a single point on the page/screen at a time – such as a mouse, single finger on a touch screen, or stylus.
        - note [ref=e3478]:
          - heading "Note" [level=3] [ref=e3479]
          - paragraph [ref=e3480]: Single pointer interactions include clicks, double clicks, taps, dragging motions, and single-finger swipe gestures. In contrast, multipoint interactions involve the use of two or more pointers at the same time, such as two-finger interactions on a touchscreen, or the simultaneous use of a mouse and stylus.
      - term [ref=e3481]:
        - term [ref=e3482] [cursor=pointer]: specific sensory experience
      - definition [ref=e3483]:
        - paragraph [ref=e3484]: a sensory experience that is not purely decorative and does not primarily convey important information or perform a function
        - complementary [ref=e3485]:
          - generic [ref=e3486]: Example
          - paragraph [ref=e3487]: Examples include a performance of a flute solo, works of visual art etc.
      - term [ref=e3488]:
        - term [ref=e3489] [cursor=pointer]: state
      - definition [ref=e3490]:
        - paragraph [ref=e3491]:
          - text: dynamic property expressing characteristics of a
          - link "user interface component" [ref=e3492] [cursor=pointer]:
            - /url: "#dfn-user-interface-components"
          - text: that may change in response to user action or automated processes
        - paragraph [ref=e3493]: States do not affect the nature of the component, but represent data associated with the component or user interaction possibilities. Examples include focus, hover, select, press, check, visited/unvisited, and expand/collapse.
      - term [ref=e3494]:
        - term [ref=e3495] [cursor=pointer]: status message
      - definition [ref=e3496]:
        - paragraph [ref=e3497]:
          - text: change in content that is not a
          - link "change of context" [ref=e3498] [cursor=pointer]:
            - /url: "#dfn-change-of-context"
          - text: ", and that provides information to the user on the success or results of an action, on the waiting state of an application, on the progress of a"
          - link "process" [ref=e3499] [cursor=pointer]:
            - /url: "#dfn-processes"
          - text: ", or on the existence of errors"
      - term [ref=e3500]:
        - term [ref=e3501] [cursor=pointer]: structure
      - definition [ref=e3502]:
        - list [ref=e3503]:
          - listitem [ref=e3504]:
            - text: The way the parts of a
            - link "web page" [ref=e3505] [cursor=pointer]:
              - /url: "#dfn-web-page-s"
            - text: are organized in relation to each other; and
          - listitem [ref=e3506]:
            - text: The way a collection of
            - link "web pages" [ref=e3507] [cursor=pointer]:
              - /url: "#dfn-web-page-s"
            - text: is organized
      - term [ref=e3508]:
        - term [ref=e3509] [cursor=pointer]: style property
      - definition [ref=e3510]:
        - paragraph [ref=e3511]: property whose value determines the presentation (e.g. font, color, size, location, padding, volume, synthesized speech prosody) of content elements as they are rendered (e.g. onscreen, via loudspeaker, via braille display) by user agents
        - paragraph [ref=e3512]: "Style properties can have several origins:"
        - list [ref=e3513]:
          - listitem [ref=e3514]: "User agent default styles: The default style property values applied in the absence of any author or user styles. Some web content technologies specify a default rendering, others do not;"
          - listitem [ref=e3515]: "Author styles: Style property values that are set by the author as part of the content (e.g. in-line styles, author style sheets);"
          - listitem [ref=e3516]: "User styles: Style property values that are set by the user (e.g. via user agent interface settings, user style sheets)"
      - term [ref=e3517]:
        - term [ref=e3518] [cursor=pointer]: supplemental content
      - definition [ref=e3519]:
        - paragraph [ref=e3520]:
          - text: additional
          - link "content" [ref=e3521] [cursor=pointer]:
            - /url: "#dfn-content"
          - text: that illustrates or clarifies the primary content
        - complementary [ref=e3522]:
          - generic [ref=e3523]: Example 1
          - paragraph [ref=e3524]:
            - text: An audio version of a
            - link "web page" [ref=e3525] [cursor=pointer]:
              - /url: "#dfn-web-page-s"
            - text: .
        - complementary [ref=e3526]:
          - generic [ref=e3527]: Example 2
          - paragraph [ref=e3528]:
            - text: An illustration of a complex
            - link "process" [ref=e3529] [cursor=pointer]:
              - /url: "#dfn-processes"
            - text: .
        - complementary [ref=e3530]:
          - generic [ref=e3531]: Example 3
          - paragraph [ref=e3532]: A paragraph summarizing the major outcomes and recommendations made in a research study.
      - term [ref=e3533]:
        - term [ref=e3534] [cursor=pointer]: synchronized media
      - definition [ref=e3535]:
        - paragraph [ref=e3536]:
          - link "audio" [ref=e3537] [cursor=pointer]:
            - /url: "#dfn-audio"
          - text: or
          - link "video" [ref=e3538] [cursor=pointer]:
            - /url: "#dfn-video"
          - text: synchronized with another format for presenting information and/or with time-based interactive components, unless the media is a
          - link "media alternative for text" [ref=e3539] [cursor=pointer]:
            - /url: "#dfn-media-alternative-for-text"
          - text: that is clearly labeled as such
      - term [ref=e3540]:
        - term [ref=e3541] [cursor=pointer]: target
      - definition [ref=e3542]:
        - paragraph [ref=e3543]:
          - text: region of the display that will accept a pointer action, such as the interactive area of a
          - link "user interface component" [ref=e3544] [cursor=pointer]:
            - /url: "#dfn-user-interface-components"
        - note [ref=e3545]:
          - heading "Note" [level=3] [ref=e3546]
          - paragraph [ref=e3547]: If two or more targets are overlapping, the overlapping area should not be included in the measurement of the target size, except when the overlapping targets perform the same action or open the same page.
      - term [ref=e3548]:
        - term [ref=e3549] [cursor=pointer]: technology
        - text: (web content)
      - definition [ref=e3550]:
        - paragraph [ref=e3551]:
          - link "mechanism" [ref=e3552] [cursor=pointer]:
            - /url: "#dfn-mechanism"
          - text: for encoding instructions to be rendered, played or executed by
          - link "user agents" [ref=e3553] [cursor=pointer]:
            - /url: "#dfn-user-agents"
        - note [ref=e3554]:
          - heading "Note 1" [level=3] [ref=e3555]
          - paragraph [ref=e3556]: As used in these guidelines "web technology" and the word "technology" (when used alone) both refer to web content technologies.
        - note [ref=e3557]:
          - heading "Note 2" [level=3] [ref=e3558]
          - paragraph [ref=e3559]: Web content technologies may include markup languages, data formats, or programming languages that authors may use alone or in combination to create end-user experiences that range from static web pages to synchronized media presentations to dynamic Web applications.
        - complementary [ref=e3560]:
          - generic [ref=e3561]: Example
          - paragraph [ref=e3562]: Some common examples of web content technologies include HTML, CSS, SVG, PNG, PDF, Flash, and JavaScript.
      - term [ref=e3563]:
        - term [ref=e3564] [cursor=pointer]: text
      - definition [ref=e3565]:
        - paragraph [ref=e3566]:
          - text: sequence of characters that can be
          - link "programmatically determined" [ref=e3567] [cursor=pointer]:
            - /url: "#dfn-programmatically-determinable"
          - text: ", where the sequence is expressing something in"
          - link "human language" [ref=e3568] [cursor=pointer]:
            - /url: "#dfn-human-language-s"
      - term [ref=e3569]:
        - term [ref=e3570] [cursor=pointer]: text alternative
      - definition [ref=e3571]:
        - paragraph [ref=e3572]:
          - link "Text" [ref=e3573] [cursor=pointer]:
            - /url: "#dfn-text"
          - text: that is programmatically associated with
          - link "non-text content" [ref=e3574] [cursor=pointer]:
            - /url: "#dfn-non-text-content"
          - text: or referred to from text that is programmatically associated with non-text content. Programmatically associated text is text whose location can be
          - link "programmatically determined" [ref=e3575] [cursor=pointer]:
            - /url: "#dfn-programmatically-determinable"
          - text: from the non-text content.
        - complementary [ref=e3576]:
          - generic [ref=e3577]: Example
          - paragraph [ref=e3578]: An image of a chart is described in text in the paragraph after the chart. The short text alternative for the chart indicates that a description follows.
        - note [ref=e3579]:
          - heading "Note" [level=3] [ref=e3580]
          - paragraph [ref=e3581]:
            - text: Refer to
            - link "Understanding Text Alternatives" [ref=e3582] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG21/Understanding/conformance#text-alternatives
            - text: for more information.
      - term [ref=e3583]:
        - term [ref=e3584] [cursor=pointer]: up-event
      - definition [ref=e3585]:
        - paragraph [ref=e3586]: platform event that occurs when the trigger stimulus of a pointer is released
        - paragraph [ref=e3587]: The up-event may have different names on different platforms, such as "touchend" or "mouseup".
      - term [ref=e3588]:
        - term [ref=e3589] [cursor=pointer]: used in an unusual or restricted way
      - definition [ref=e3590]:
        - paragraph [ref=e3591]: words used in such a way that requires users to know exactly which definition to apply in order to understand the content correctly
        - complementary [ref=e3592]:
          - generic [ref=e3593]: Example
          - paragraph [ref=e3594]: The term "gig" means something different if it occurs in a discussion of music concerts than it does in article about computer hard drive space, but the appropriate definition can be determined from context. By contrast, the word "text" is used in a very specific way in WCAG 2, so a definition is supplied in the glossary.
      - term [ref=e3595]:
        - term [ref=e3596] [cursor=pointer]: user agent
      - definition [ref=e3597]:
        - paragraph [ref=e3598]: any software that retrieves and presents web content for users
        - complementary [ref=e3599]:
          - generic [ref=e3600]: Example
          - paragraph [ref=e3601]:
            - text: Web browsers, media players, plug-ins, and other programs — including
            - link "assistive technologies" [ref=e3602] [cursor=pointer]:
              - /url: "#dfn-assistive-technologies"
            - text: — that help in retrieving, rendering, and interacting with web content.
      - term [ref=e3603]:
        - term [ref=e3604] [cursor=pointer]: user-controllable
      - definition [ref=e3605]:
        - paragraph [ref=e3606]: data that is intended to be accessed by users
        - note [ref=e3607]:
          - heading "Note" [level=3] [ref=e3608]
          - paragraph [ref=e3609]: This does not refer to such things as Internet logs and search engine monitoring data.
        - complementary [ref=e3610]:
          - generic [ref=e3611]: Example
          - paragraph [ref=e3612]: Name and address fields for a user's account.
      - term [ref=e3613]:
        - term [ref=e3614] [cursor=pointer]: user interface component
      - definition [ref=e3615]:
        - paragraph [ref=e3616]: a part of the content that is perceived by users as a single control for a distinct function
        - note [ref=e3617]:
          - heading "Note 1" [level=3] [ref=e3618]
          - paragraph [ref=e3619]: Multiple user interface components may be implemented as a single programmatic element. "Components" here is not tied to programming techniques, but rather to what the user perceives as separate controls.
        - note [ref=e3620]:
          - heading "Note 2" [level=3] [ref=e3621]
          - paragraph [ref=e3622]: User interface components include form elements and links as well as components generated by scripts.
        - note [ref=e3623]:
          - heading "Note 3" [level=3] [ref=e3624]
          - paragraph [ref=e3625]: What is meant by "component" or "user interface component" here is also sometimes called "user interface element".
        - complementary [ref=e3626]:
          - generic [ref=e3627]: Example
          - paragraph [ref=e3628]: An applet has a "control" that can be used to move through content by line or page or random access. Since each of these would need to have a name and be settable independently, they would each be a "user interface component."
      - term [ref=e3629]:
        - term [ref=e3630] [cursor=pointer]: user inactivity
      - definition [ref=e3631]:
        - paragraph [ref=e3632]: any continuous period of time where no user actions occur
        - paragraph [ref=e3633]: The method of tracking will be determined by the website or application.
      - term [ref=e3634]:
        - term [ref=e3635] [cursor=pointer]: video
      - definition [ref=e3636]:
        - paragraph [ref=e3637]: the technology of moving or sequenced pictures or images
        - note [ref=e3638]:
          - heading "Note" [level=3] [ref=e3639]
          - paragraph [ref=e3640]: Video can be made up of animated or photographic images, or both.
      - term [ref=e3641]:
        - term [ref=e3642] [cursor=pointer]: video-only
      - definition [ref=e3643]:
        - paragraph [ref=e3644]:
          - text: a time-based presentation that contains only
          - link "video" [ref=e3645] [cursor=pointer]:
            - /url: "#dfn-video"
          - text: (no
          - link "audio" [ref=e3646] [cursor=pointer]:
            - /url: "#dfn-audio"
          - text: and no interaction)
      - term [ref=e3647]:
        - term [ref=e3648] [cursor=pointer]: viewport
      - definition [ref=e3649]:
        - paragraph [ref=e3650]:
          - text: object in which the
          - link "user agent" [ref=e3651] [cursor=pointer]:
            - /url: "#dfn-user-agents"
          - text: presents content
        - note [ref=e3652]:
          - heading "Note 1" [level=3] [ref=e3653]
          - paragraph [ref=e3654]: The user agent presents content through one or more viewports. Viewports include windows, frames, loudspeakers, and virtual magnifying glasses. A viewport may contain another viewport (e.g., nested frames). Interface components created by the user agent such as prompts, menus, and alerts are not viewports.
        - note [ref=e3655]:
          - heading "Note 2" [level=3] [ref=e3656]
          - paragraph [ref=e3657]:
            - text: This definition is based on
            - link "User Agent Accessibility Guidelines 1.0 Glossary" [ref=e3658] [cursor=pointer]:
              - /url: https://www.w3.org/TR/WAI-USERAGENT/glossary.html
            - text: "["
            - link "UAAG10" [ref=e3660] [cursor=pointer]:
              - /url: "#bib-uaag10"
            - text: "]."
      - term [ref=e3661]:
        - term [ref=e3662] [cursor=pointer]: visually customized
      - definition [ref=e3663]:
        - paragraph [ref=e3664]: the font, size, color, and background can be set
      - term [ref=e3665]:
        - term [ref=e3666] [cursor=pointer]: web page
      - definition [ref=e3667]:
        - paragraph [ref=e3668]:
          - text: a non-embedded resource obtained from a single URI using HTTP plus any other resources that are used in the rendering or intended to be rendered together with it by a
          - link "user agent" [ref=e3669] [cursor=pointer]:
            - /url: "#dfn-user-agents"
        - note [ref=e3670]:
          - heading "Note 1" [level=3] [ref=e3671]
          - paragraph [ref=e3672]: Although any "other resources" would be rendered together with the primary resource, they would not necessarily be rendered simultaneously with each other.
        - note [ref=e3673]:
          - heading "Note 2" [level=3] [ref=e3674]
          - paragraph [ref=e3675]: For the purposes of conformance with these guidelines, a resource must be "non-embedded" within the scope of conformance to be considered a web page.
        - complementary [ref=e3676]:
          - generic [ref=e3677]: Example 1
          - paragraph [ref=e3678]: A web resource including all embedded images and media.
        - complementary [ref=e3679]:
          - generic [ref=e3680]: Example 2
          - paragraph [ref=e3681]: A web mail program built using Asynchronous JavaScript and XML (AJAX). The program lives entirely at http://example.com/mail, but includes an inbox, a contacts area and a calendar. Links or buttons are provided that cause the inbox, contacts, or calendar to display, but do not change the URI of the page as a whole.
        - complementary [ref=e3682]:
          - generic [ref=e3683]: Example 3
          - paragraph [ref=e3684]: A customizable portal site, where users can choose content to display from a set of different content modules.
        - complementary [ref=e3685]:
          - generic [ref=e3686]: Example 4
          - paragraph [ref=e3687]: When you enter "http://shopping.example.com/" in your browser, you enter a movie-like interactive shopping environment where you visually move around in a store dragging products off of the shelves around you and into a visual shopping cart in front of you. Clicking on a product causes it to be demonstrated with a specification sheet floating alongside. This might be a single-page website or just one page within a website.
  - generic [ref=e3688]:
    - generic [ref=e3689]:
      - heading "7. Input Purposes for User Interface Components" [level=2] [ref=e3690]
      - link "Permalink for Section 7." [ref=e3691] [cursor=pointer]:
        - /url: "#input-purposes"
        - text: §
    - paragraph [ref=e3692]:
      - text: This section contains a listing of common
      - link "user interface component" [ref=e3693] [cursor=pointer]:
        - /url: "#dfn-user-interface-components"
      - text: input purposes. The terms below are not keywords that must be used, but instead represent purposes that must be captured in the taxonomy adopted by a webpage. Where applicable, authors mark up controls with the chosen taxonomy to indicate the semantic purpose. This provides the potential for user agents and assistive technologies to apply personalized presentations that can enable more people to understand and use the content.
    - note [ref=e3694]:
      - heading "Note" [level=3] [ref=e3695]
      - paragraph [ref=e3696]:
        - text: The list of input type purposes is based on the control purposes defined in the
        - link "HTML specification's Autofill section" [ref=e3697] [cursor=pointer]:
          - /url: https://html.spec.whatwg.org/multipage/form-control-infrastructure.html#autofill
        - text: ", but it is important to understand that a different technology may have some or all of the same concepts defined in its specification and only the concepts that are mapped to the meanings below are required."
    - paragraph [ref=e3698]: The following input control purposes are intended to relate to the user of the content and pertain only to information related to that individual.
    - list [ref=e3699]:
      - listitem [ref=e3700]:
        - code [ref=e3701]: name
        - text: "- Full name"
      - listitem [ref=e3702]:
        - code [ref=e3703]: honorific-prefix
        - text: "- Prefix or title (e.g., \"Mr.\", \"Ms.\", \"Dr.\", \"M"
        - superscript [ref=e3704]: lle
        - text: "\")"
      - listitem [ref=e3705]:
        - code [ref=e3706]: given-name
        - text: "- Given name (in some Western cultures, also known as the first name)"
      - listitem [ref=e3707]:
        - code [ref=e3708]: additional-name
        - text: "- Additional names (in some Western cultures, also known as middle names, forenames other than the first name)"
      - listitem [ref=e3709]:
        - code [ref=e3710]: family-name
        - text: "- Family name (in some Western cultures, also known as the last name or surname)"
      - listitem [ref=e3711]:
        - code [ref=e3712]: honorific-suffix
        - text: "- Suffix (e.g., \"Jr.\", \"B.Sc.\", \"MBASW\", \"II\")"
      - listitem [ref=e3713]:
        - code [ref=e3714]: nickname
        - text: "- Nickname, screen name, handle: a typically short name used instead of the full name"
      - listitem [ref=e3715]:
        - code [ref=e3716]: organization-title
        - text: "- Job title (e.g., \"Software Engineer\", \"Senior Vice President\", \"Deputy Managing Director\")"
      - listitem [ref=e3717]:
        - code [ref=e3718]: username
        - text: "- A username"
      - listitem [ref=e3719]:
        - code [ref=e3720]: new-password
        - text: "- A new password (e.g., when creating an account or changing a password)"
      - listitem [ref=e3721]:
        - code [ref=e3722]: current-password
        - text: "- The current password for the account identified by the"
        - code [ref=e3723]: username
        - text: field (e.g., when logging in)
      - listitem [ref=e3724]:
        - code [ref=e3725]: organization
        - text: "- Company name corresponding to the person, address, or contact information in the other fields associated with this field"
      - listitem [ref=e3726]:
        - code [ref=e3727]: street-address
        - text: "- Street address (multiple lines, newlines preserved)"
      - listitem [ref=e3728]:
        - code [ref=e3729]: address-line1
        - text: "- Street address (one line per field, line 1)"
      - listitem [ref=e3730]:
        - code [ref=e3731]: address-line2
        - text: "- Street address (one line per field, line 2)"
      - listitem [ref=e3732]:
        - code [ref=e3733]: address-line3
        - text: "- Street address (one line per field, line 3)"
      - listitem [ref=e3734]:
        - code [ref=e3735]: address-level4
        - text: "- The most fine-grained administrative level, in addresses with four administrative levels"
      - listitem [ref=e3736]:
        - code [ref=e3737]: address-level3
        - text: "- The third administrative level, in addresses with three or more administrative levels"
      - listitem [ref=e3738]:
        - code [ref=e3739]: address-level2
        - text: "- The second administrative level, in addresses with two or more administrative levels; in the countries with two administrative levels, this would typically be the city, town, village, or other locality within which the relevant street address is found"
      - listitem [ref=e3740]:
        - code [ref=e3741]: address-level1
        - text: "- The broadest administrative level in the address, i.e., the province within which the locality is found; for example, in the US, this would be the state; in Switzerland it would be the canton; in the UK, the post town"
      - listitem [ref=e3742]:
        - code [ref=e3743]: country
        - text: "- Country code"
      - listitem [ref=e3744]:
        - code [ref=e3745]: country-name
        - text: "- Country name"
      - listitem [ref=e3746]:
        - code [ref=e3747]: postal-code
        - text: "- Postal code, post code, ZIP code, CEDEX code (if CEDEX, append \"CEDEX\", and the arrondissement, if relevant, to the"
        - code [ref=e3748]: address-level2
        - text: field)
      - listitem [ref=e3749]:
        - code [ref=e3750]: cc-name
        - text: "- Full name as given on the payment instrument"
      - listitem [ref=e3751]:
        - code [ref=e3752]: cc-given-name
        - text: "- Given name as given on the payment instrument (in some Western cultures, also known as the first name)"
      - listitem [ref=e3753]:
        - code [ref=e3754]: cc-additional-name
        - text: "- Additional names given on the payment instrument (in some Western cultures, also known as middle names, forenames other than the first name)"
      - listitem [ref=e3755]:
        - code [ref=e3756]: cc-family-name
        - text: "- Family name given on the payment instrument (in some Western cultures, also known as the last name or surname)"
      - listitem [ref=e3757]:
        - code [ref=e3758]: cc-number
        - text: "- Code identifying the payment instrument (e.g., the credit card number)"
      - listitem [ref=e3759]:
        - code [ref=e3760]: cc-exp
        - text: "- Expiration date of the payment instrument"
      - listitem [ref=e3761]:
        - code [ref=e3762]: cc-exp-month
        - text: "- Month component of the expiration date of the payment instrument"
      - listitem [ref=e3763]:
        - code [ref=e3764]: cc-exp-year
        - text: "- Year component of the expiration date of the payment instrument"
      - listitem [ref=e3765]:
        - code [ref=e3766]: cc-csc
        - text: "- Security code for the payment instrument (also known as the card security code (CSC), card validation code (CVC), card verification value (CVV), signature panel code (SPC), credit card ID (CCID), etc)"
      - listitem [ref=e3767]:
        - code [ref=e3768]: cc-type
        - text: "- Type of payment instrument"
      - listitem [ref=e3769]:
        - code [ref=e3770]: transaction-currency
        - text: "- The currency that the user would prefer the transaction to use"
      - listitem [ref=e3771]:
        - code [ref=e3772]: transaction-amount
        - text: "- The amount that the user would like for the transaction (e.g., when entering a bid or sale price)"
      - listitem [ref=e3773]:
        - code [ref=e3774]: language
        - text: "- Preferred language"
      - listitem [ref=e3775]:
        - code [ref=e3776]: bday
        - text: "- Birthday"
      - listitem [ref=e3777]:
        - code [ref=e3778]: bday-day
        - text: "- Day component of birthday"
      - listitem [ref=e3779]:
        - code [ref=e3780]: bday-month
        - text: "- Month component of birthday"
      - listitem [ref=e3781]:
        - code [ref=e3782]: bday-year
        - text: "- Year component of birthday"
      - listitem [ref=e3783]:
        - code [ref=e3784]: sex
        - text: "- Gender identity (e.g., Female, Fa’afafine)"
      - listitem [ref=e3785]:
        - code [ref=e3786]: url
        - text: "- Home page or other web page corresponding to the company, person, address, or contact information in the other fields associated with this field"
      - listitem [ref=e3787]:
        - code [ref=e3788]: photo
        - text: "- Photograph, icon, or other image corresponding to the company, person, address, or contact information in the other fields associated with this field"
      - listitem [ref=e3789]:
        - code [ref=e3790]: tel
        - text: "- Full telephone number, including country code"
      - listitem [ref=e3791]:
        - code [ref=e3792]: tel-country-code
        - text: "- Country code component of the telephone number"
      - listitem [ref=e3793]:
        - code [ref=e3794]: tel-national
        - text: "- Telephone number without the country code component, with a country-internal prefix applied if applicable"
      - listitem [ref=e3795]:
        - code [ref=e3796]: tel-area-code
        - text: "- Area code component of the telephone number, with a country-internal prefix applied if applicable"
      - listitem [ref=e3797]:
        - code [ref=e3798]: tel-local
        - text: "- Telephone number without the country code and area code components"
      - listitem [ref=e3799]:
        - code [ref=e3800]: tel-local-prefix
        - text: "- First part of the component of the telephone number that follows the area code, when that component is split into two components"
      - listitem [ref=e3801]:
        - code [ref=e3802]: tel-local-suffix
        - text: "- Second part of the component of the telephone number that follows the area code, when that component is split into two components"
      - listitem [ref=e3803]:
        - code [ref=e3804]: tel-extension
        - text: "- Telephone number internal extension code"
      - listitem [ref=e3805]:
        - code [ref=e3806]: email
        - text: "- E-mail address"
      - listitem [ref=e3807]:
        - code [ref=e3808]: impp
        - text: "- URL representing an instant messaging protocol endpoint (for example, \""
        - code [ref=e3809]: aim:goim?screenname=example
        - text: "\" or \""
        - code [ref=e3810]: xmpp:fred@example.net
        - text: "\")"
