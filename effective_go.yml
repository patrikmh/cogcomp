    - generic [ref=e2357]:
      - generic [ref=e2358]:
        - heading "5.2 Conformance Requirements" [level=3] [ref=e2359]
        - link "Permalink for Section 5.2" [ref=e2360] [cursor=pointer]:
          - /url: "#conformance-reqs"
          - text: §
      - paragraph [ref=e2361]: "In order for a web page to conform to WCAG 2.2, all of the following conformance requirements must be satisfied:"
      - generic [ref=e2362]:
        - generic [ref=e2363]:
          - heading "5.2.1 Conformance Level" [level=4] [ref=e2364]
          - link "Permalink for Section 5.2.1" [ref=e2365] [cursor=pointer]:
            - /url: "#cc1"
            - text: §
        - paragraph [ref=e2366]: One of the following levels of conformance is met in full.
        - list [ref=e2367]:
          - listitem [ref=e2368]:
            - text: For Level A conformance (the minimum level of conformance), the
            - link "web page" [ref=e2369] [cursor=pointer]:
              - /url: "#dfn-web-page-s"
            - link "satisfies" [ref=e2370] [cursor=pointer]:
              - /url: "#dfn-satisfies"
            - text: all the Level A success criteria, or a
            - link "conforming alternate version" [ref=e2371] [cursor=pointer]:
              - /url: "#dfn-conforming-alternate-versions"
            - text: is provided.
          - listitem [ref=e2372]: For Level AA conformance, the web page satisfies all the Level A and Level AA success criteria, or a Level AA conforming alternate version is provided.
          - listitem [ref=e2373]: For Level AAA conformance, the web page satisfies all the Level A, Level AA and Level AAA success criteria, or a Level AAA conforming alternate version is provided.
        - note [ref=e2374]:
          - heading "Note 1" [level=5] [ref=e2375]
          - paragraph [ref=e2376]: Although conformance can only be achieved at the stated levels, authors are encouraged to report (in their claim) any progress toward meeting success criteria from all levels beyond the achieved level of conformance.
        - note [ref=e2377]:
          - heading "Note 2" [level=5] [ref=e2378]
          - paragraph [ref=e2379]: It is not recommended that Level AAA conformance be required as a general policy for entire sites because it is not possible to satisfy all Level AAA success criteria for some content.
      - generic [ref=e2380]:
        - generic [ref=e2381]:
          - heading "5.2.2 Full pages" [level=4] [ref=e2382]
          - link "Permalink for Section 5.2.2" [ref=e2383] [cursor=pointer]:
            - /url: "#cc2"
            - text: §
        - paragraph [ref=e2384]:
          - link "Conformance" [ref=e2385] [cursor=pointer]:
            - /url: "#dfn-conform"
          - text: (and conformance level) is for full
          - link "web page(s)" [ref=e2386] [cursor=pointer]:
            - /url: "#dfn-web-page-s"
          - text: only, and cannot be achieved if part of a web page is excluded.
        - note [ref=e2387]:
          - heading "Note 1" [level=5] [ref=e2388]
          - paragraph [ref=e2389]: For the purpose of determining conformance, alternatives to part of a page's content are considered part of the page when the alternatives can be obtained directly from the page, e.g., a long description or an alternative presentation of a video.
        - note [ref=e2390]:
          - heading "Note 2" [level=5] [ref=e2391]
          - paragraph [ref=e2392]:
            - text: Authors of web pages that cannot conform due to content outside of the author's control may consider a
            - link "Statement of Partial Conformance" [ref=e2393] [cursor=pointer]:
              - /url: "#conformance-partial"
            - text: .
        - note [ref=e2394]:
          - heading "Note 3" [level=5] [ref=e2395]
          - paragraph [ref=e2396]: A full page includes each variation of the page that is automatically presented by the page for various screen sizes (e.g. variations in a responsive web page). Each of these variations needs to conform (or needs to have a conforming alternate version) in order for the entire page to conform.
      - generic [ref=e2397]:
        - generic [ref=e2398]:
          - heading "5.2.3 Complete processes" [level=4] [ref=e2399]
          - link "Permalink for Section 5.2.3" [ref=e2400] [cursor=pointer]:
            - /url: "#cc3"
            - text: §
        - paragraph [ref=e2401]:
          - text: When a
          - link "web page" [ref=e2402] [cursor=pointer]:
            - /url: "#dfn-web-page-s"
          - text: is one of a series of web pages presenting a
          - link "process" [ref=e2403] [cursor=pointer]:
            - /url: "#dfn-processes"
          - text: (i.e., a sequence of steps that need to be completed in order to accomplish an activity), all web pages in the process conform at the specified level or better. (Conformance is not possible at a particular level if any page in the process does not conform at that level or better.)
        - complementary [ref=e2404]:
          - generic [ref=e2405]: Example
          - paragraph [ref=e2406]: An online store has a series of pages that are used to select and purchase products. All pages in the series from start to finish (checkout) conform in order for any page that is part of the process to conform.
      - generic [ref=e2407]:
        - generic [ref=e2408]:
          - heading "5.2.4 Only Accessibility-Supported Ways of Using Technologies" [level=4] [ref=e2409]
          - link "Permalink for Section 5.2.4" [ref=e2410] [cursor=pointer]:
            - /url: "#cc4"
            - text: §
        - paragraph [ref=e2411]:
          - text: Only
          - link "accessibility-supported" [ref=e2412] [cursor=pointer]:
            - /url: "#dfn-accessibility-supported"
          - text: ways of using
          - link "technologies" [ref=e2413] [cursor=pointer]:
            - /url: "#dfn-technologies"
          - text: are
          - link "relied upon" [ref=e2414] [cursor=pointer]:
            - /url: "#dfn-relied-upon"
          - text: to satisfy the success criteria. Any information or functionality that is provided in a way that is not accessibility supported is also available in a way that is accessibility supported. (See
          - link "Understanding accessibility support" [ref=e2415] [cursor=pointer]:
            - /url: https://www.w3.org/WAI/WCAG22/Understanding/conformance#accessibility-support
          - text: .)
      - generic [ref=e2416]:
        - generic [ref=e2417]:
          - heading "5.2.5 Non-Interference" [level=4] [ref=e2418]
          - link "Permalink for Section 5.2.5" [ref=e2419] [cursor=pointer]:
            - /url: "#cc5"
            - text: §
        - paragraph [ref=e2420]:
          - text: If
          - link "technologies" [ref=e2421] [cursor=pointer]:
            - /url: "#dfn-technologies"
          - text: are used in a way that is not
          - link "accessibility supported" [ref=e2422] [cursor=pointer]:
            - /url: "#dfn-accessibility-supported"
          - text: ", or if they are used in a non-conforming way, then they do not block the ability of users to access the rest of the page. In addition, the"
          - link "web page" [ref=e2423] [cursor=pointer]:
            - /url: "#dfn-web-page-s"
          - text: "as a whole continues to meet the conformance requirements under each of the following conditions:"
        - list [ref=e2424]:
          - listitem [ref=e2425]:
            - text: when any technology that is not
            - link "relied upon" [ref=e2426] [cursor=pointer]:
              - /url: "#dfn-relied-upon"
            - text: is turned on in a user agent,
          - listitem [ref=e2427]: when any technology that is not relied upon is turned off in a user agent, and
          - listitem [ref=e2428]: when any technology that is not relied upon is not supported by a user agent
        - paragraph [ref=e2429]: "In addition, the following success criteria apply to all content on the page, including content that is not otherwise relied upon to meet conformance, because failure to meet them could interfere with any use of the page:"
        - list [ref=e2430]:
          - listitem [ref=e2431]:
            - strong [ref=e2432]: 1.4.2 - Audio Control
            - text: ","
          - listitem [ref=e2433]:
            - strong [ref=e2434]: 2.1.2 - No Keyboard Trap
            - text: ","
          - listitem [ref=e2435]:
            - strong [ref=e2436]: 2.3.1 - Three Flashes or Below Threshold
            - text: ", and"
          - listitem [ref=e2437]:
            - strong [ref=e2438]: 2.2.2 - Pause, Stop, Hide
            - text: .
        - note [ref=e2439]:
          - heading "Note" [level=5] [ref=e2440]
          - paragraph [ref=e2441]: If a page cannot conform (for example, a conformance test page or an example page), it cannot be included in the scope of conformance or in a conformance claim.
        - paragraph [ref=e2442]:
          - text: For more information, including examples, see
          - link "Understanding Conformance Requirements" [ref=e2443] [cursor=pointer]:
            - /url: https://www.w3.org/WAI/WCAG22/Understanding/conformance#conformance-requirements
          - text: .
    - generic [ref=e2444]:
      - generic [ref=e2445]:
        - heading "5.3 Conformance Claims (Optional)" [level=3] [ref=e2446]
        - link "Permalink for Section 5.3" [ref=e2447] [cursor=pointer]:
          - /url: "#conformance-claims"
          - text: §
      - paragraph [ref=e2448]:
        - text: Conformance is defined only for
        - link "web pages" [ref=e2449] [cursor=pointer]:
          - /url: "#dfn-web-page-s"
        - text: . However, a conformance claim may be made to cover one page, a series of pages, or multiple related web pages.
      - generic [ref=e2450]:
        - generic [ref=e2451]:
          - heading "5.3.1 Required Components of a Conformance Claim" [level=4] [ref=e2452]
          - link "Permalink for Section 5.3.1" [ref=e2453] [cursor=pointer]:
            - /url: "#conformance-required"
            - text: §
        - paragraph [ref=e2454]:
          - text: Conformance claims are
          - strong [ref=e2455]: not required
          - text: . Authors can conform to WCAG 2.2 without making a claim. However, if a conformance claim is made, then the conformance claim
          - strong [ref=e2456]: must
          - text: "include the following information:"
        - list [ref=e2457]:
          - listitem [ref=e2458]:
            - strong [ref=e2459]: Date
            - text: of the claim
          - listitem [ref=e2460]:
            - strong [ref=e2461]: Guidelines title, version and URI
            - text: "\"Web Content Accessibility Guidelines 2.2 at"
            - link "https://www.w3.org/TR/WCAG22/" [ref=e2462] [cursor=pointer]:
              - /url: https://www.w3.org/TR/WCAG22/
            - text: "\""
          - listitem [ref=e2463]:
            - strong [ref=e2464]: Conformance level
            - text: "satisfied: (Level A, AA or AAA)"
          - listitem [ref=e2465]:
            - paragraph [ref=e2466]:
              - strong [ref=e2467]: A concise description of the web pages
              - text: ", such as a list of URIs for which the claim is made, including whether subdomains are included in the claim."
            - note [ref=e2468]:
              - heading "Note 1" [level=5] [ref=e2469]
              - paragraph [ref=e2470]: The web pages may be described by list or by an expression that describes all of the URIs included in the claim.
            - note [ref=e2471]:
              - heading "Note 2" [level=5] [ref=e2472]
              - paragraph [ref=e2473]: Web-based products that do not have a URI prior to installation on the customer's website may have a statement that the product would conform when installed.
          - listitem [ref=e2474]:
            - text: A list of the
            - strong [ref=e2475]:
              - link "web content technologies" [ref=e2476] [cursor=pointer]:
                - /url: "#dfn-technologies"
              - link "relied upon" [ref=e2477] [cursor=pointer]:
                - /url: "#dfn-relied-upon"
            - text: .
        - note [ref=e2478]:
          - heading "Note 3" [level=5] [ref=e2479]
          - paragraph [ref=e2480]: If a conformance logo is used, it would constitute a claim and must be accompanied by the required components of a conformance claim listed above.
      - generic [ref=e2481]:
        - generic [ref=e2482]:
          - heading "5.3.2 Optional Components of a Conformance Claim" [level=4] [ref=e2483]
          - link "Permalink for Section 5.3.2" [ref=e2484] [cursor=pointer]:
            - /url: "#conformance-optional"
            - text: §
        - paragraph [ref=e2485]: "In addition to the required components of a conformance claim above, consider providing additional information to assist users. Recommended additional information includes:"
        - list [ref=e2486]:
          - listitem [ref=e2487]: A list of success criteria beyond the level of conformance claimed that have been met. This information should be provided in a form that users can use, preferably machine-readable metadata.
          - listitem [ref=e2488]:
            - text: A list of the specific technologies that are "
            - emphasis [ref=e2489]:
              - text: used but not
              - link "relied upon" [ref=e2490] [cursor=pointer]:
                - /url: "#dfn-relied-upon"
            - text: ."
          - listitem [ref=e2491]: A list of user agents, including assistive technologies that were used to test the content.
          - listitem [ref=e2492]: A list of specific accessibility characteristics of the content, provided in machine-readable metadata.
          - listitem [ref=e2493]: Information about any additional steps taken that go beyond the success criteria to enhance accessibility.
          - listitem [ref=e2494]:
            - text: A machine-readable metadata version of the list of specific technologies that are
            - link "relied upon" [ref=e2495] [cursor=pointer]:
              - /url: "#dfn-relied-upon"
            - text: .
          - listitem [ref=e2496]: A machine-readable metadata version of the conformance claim.
        - note [ref=e2497]:
          - heading "Note 1" [level=5] [ref=e2498]
          - paragraph [ref=e2499]:
            - text: Refer to
            - link "Understanding Conformance Claims" [ref=e2500] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG22/Understanding/conformance#conformance-claims
            - text: for more information and example conformance claims.
        - note [ref=e2501]:
          - heading "Note 2" [level=5] [ref=e2502]
          - paragraph [ref=e2503]:
            - text: Refer to
            - link "Understanding Metadata" [ref=e2504] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG22/Understanding/understanding-metadata
            - text: for more information about the use of metadata in conformance claims.
    - generic [ref=e2505]:
      - generic [ref=e2506]:
        - heading "5.4 Statement of Partial Conformance - Third Party Content" [level=3] [ref=e2507]
        - link "Permalink for Section 5.4" [ref=e2508] [cursor=pointer]:
          - /url: "#conformance-partial"
          - text: §
      - paragraph [ref=e2509]: Web pages that will later have additional content added can use a 'statement of partial conformance'. For example, an email program, a blog, an article that allows users to add comments, or applications supporting user-contributed content. Another example would be a page, such as a portal or news site, composed of content aggregated from multiple contributors, or sites that automatically insert content from other sources over time, such as when advertisements are inserted dynamically.
      - paragraph [ref=e2510]: "In these cases, it is not possible to know at the time of original posting what the uncontrolled content of the pages will be. It is important to note that the uncontrolled content can affect the accessibility of the controlled content as well. Two options are available:"
      - list [ref=e2511]:
        - listitem [ref=e2512]:
          - paragraph [ref=e2513]: A determination of conformance can be made based on best knowledge. If a page of this type is monitored and repaired (non-conforming content is removed or brought into conformance) within two business days, then a determination or claim of conformance can be made since, except for errors in externally contributed content which are corrected or removed when encountered, the page conforms. No conformance claim can be made if it is not possible to monitor or correct non-conforming content;
          - paragraph [ref=e2514]:
            - strong [ref=e2515]: OR
        - listitem [ref=e2516]:
          - paragraph [ref=e2517]: "A \"statement of partial conformance\" may be made that the page does not conform, but could conform if certain parts were removed. The form of that statement would be, \"This page does not conform, but would conform to WCAG 2.2 at level X if the following parts from uncontrolled sources were removed.\" In addition, the following would also be true of uncontrolled content that is described in the statement of partial conformance:"
          - list [ref=e2518]:
            - listitem [ref=e2519]: It is not content that is under the author's control.
            - listitem [ref=e2520]: It is described in a way that users can identify (e.g., they cannot be described as "all parts that we do not control" unless they are clearly marked as such.)
    - generic [ref=e2521]:
      - generic [ref=e2522]:
        - heading "5.5 Statement of Partial Conformance - Language" [level=3] [ref=e2523]
        - link "Permalink for Section 5.5" [ref=e2524] [cursor=pointer]:
          - /url: "#conformance-partial-lang"
          - text: §
      - paragraph [ref=e2525]:
        - text: A "statement of partial conformance due to language" may be made when the page does not conform, but would conform if
        - link "accessibility support" [ref=e2526] [cursor=pointer]:
          - /url: "#dfn-accessibility-supported"
        - text: existed for (all of) the language(s) used on the page. The form of that statement would be, "This page does not conform, but would conform to WCAG 2.2 at level X if accessibility support existed for the following language(s):"
    - generic [ref=e2527]:
      - generic [ref=e2528]:
        - heading "5.6 Privacy Considerations" [level=3] [ref=e2529]
        - link "Permalink for Section 5.6" [ref=e2530] [cursor=pointer]:
          - /url: "#privacy-summary"
          - text: §
      - paragraph [ref=e2531]:
        - emphasis [ref=e2532]: This section is non-normative.
      - paragraph [ref=e2533]: Success criteria within this specification which the Working Group has identified possible implications for privacy, either by providing protections for end users or which are important for website providers to take in to consideration when implementing features designed to protect user privacy, are listed below. This list reflects the current understanding of the Working Group but other Success criteria may have privacy implications that the Working Group is not aware of at the time of publishing.
      - paragraph [ref=e2534]: "Success criteria within this specification that may relate to privacy are:"
      - list [ref=e2535]:
        - listitem [ref=e2536]:
          - link "2.2.6 Timeouts (AAA)" [ref=e2537] [cursor=pointer]:
            - /url: "#timeouts"
        - listitem [ref=e2538]:
          - link "3.3.7 Redundant Entry (A)" [ref=e2539] [cursor=pointer]:
            - /url: "#redundant-entry"
    - generic [ref=e2540]:
      - generic [ref=e2541]:
        - heading "5.7 Security Considerations" [level=3] [ref=e2542]
        - link "Permalink for Section 5.7" [ref=e2543] [cursor=pointer]:
          - /url: "#security-summary"
          - text: §
      - paragraph [ref=e2544]:
        - emphasis [ref=e2545]: This section is non-normative.
      - paragraph [ref=e2546]: Success criteria within this specification which the Working Group has identified possible implications for security, either by providing protections for end users or which are important for website providers to take in to consideration when implementing features designed to protect user security, are listed below. This list reflects the current understanding of the Working Group but other Success criteria may have security implications that the Working Group is not aware of at the time of publishing.
      - paragraph [ref=e2547]: "Success criteria within this specification that may relate to security are:"
      - list [ref=e2548]:
        - listitem [ref=e2549]:
          - link "1.1.1 Non-text Content (A)" [ref=e2550] [cursor=pointer]:
            - /url: "#non-text-content"
        - listitem [ref=e2551]:
          - link "1.3.5 Identify Input Purpose (AA)" [ref=e2552] [cursor=pointer]:
            - /url: "#identify-input-purpose"
        - listitem [ref=e2553]:
          - link "1.4.7 Low or No Background Audio (AAA)" [ref=e2554] [cursor=pointer]:
            - /url: "#low-or-no-background-audio"
        - listitem [ref=e2555]:
          - link "2.2.1 Timing Adjustable (A)" [ref=e2556] [cursor=pointer]:
            - /url: "#timing-adjustable"
        - listitem [ref=e2557]:
          - link "2.2.5 Re-authenticating (AAA)" [ref=e2558] [cursor=pointer]:
            - /url: "#re-authenticating"
        - listitem [ref=e2559]:
          - link "2.2.6 Timeouts (AAA)" [ref=e2560] [cursor=pointer]:
            - /url: "#timeouts"
        - listitem [ref=e2561]:
          - link "2.5.6 Concurrent Input Mechanisms (AAA)" [ref=e2562] [cursor=pointer]:
            - /url: "#concurrent-input-mechanisms"
        - listitem [ref=e2563]:
          - link "3.3.3 Error Suggestion (AA)" [ref=e2564] [cursor=pointer]:
            - /url: "#error-suggestion"
        - listitem [ref=e2565]:
          - link "3.3.7 Redundant Entry (A)" [ref=e2566] [cursor=pointer]:
            - /url: "#redundant-entry"
        - listitem [ref=e2567]:
          - link "3.3.8 Accessible Authentication (Minimum) (AA)" [ref=e2568] [cursor=pointer]:
            - /url: "#accessible-authentication-minimum"
        - listitem [ref=e2569]:
          - link "3.3.9 Accessible Authentication (Enhanced) (AAA)" [ref=e2570] [cursor=pointer]:
            - /url: "#accessible-authentication-enhanced"
  - generic [ref=e2571]:
    - generic [ref=e2572]:
      - heading "6. Glossary" [level=2] [ref=e2573]
      - link "Permalink for Section 6." [ref=e2574] [cursor=pointer]:
        - /url: "#glossary"
        - text: §
    - generic [ref=e2575]:
      - term [ref=e2576]:
        - term [ref=e2577] [cursor=pointer]: abbreviation
      - definition [ref=e2578]:
        - paragraph [ref=e2579]: shortened form of a word, phrase, or name where the abbreviation has not become part of the language
        - note [ref=e2580]:
          - heading "Note 1" [level=3] [ref=e2581]
          - paragraph [ref=e2582]: "This includes initialisms and acronyms where:"
        - list [ref=e2583]:
          - listitem [ref=e2584]:
            - paragraph [ref=e2585]:
              - strong [ref=e2586]: initialisms
              - text: are shortened forms of a name or phrase made from the initial letters of words or syllables contained in that name or phrase
            - note [ref=e2587]:
              - heading "Note 2" [level=3] [ref=e2588]
              - paragraph [ref=e2589]: Not defined in all languages.
            - complementary [ref=e2590]:
              - generic [ref=e2591]: Example 1
              - paragraph [ref=e2592]: SNCF is a French initialism that contains the initial letters of the Société Nationale des Chemins de Fer, the French national railroad.
            - complementary [ref=e2593]:
              - generic [ref=e2594]: Example 2
              - paragraph [ref=e2595]: ESP is an initialism for extrasensory perception.
          - listitem [ref=e2596]:
            - paragraph [ref=e2597]:
              - strong [ref=e2598]: acronyms
              - text: are abbreviated forms made from the initial letters or parts of other words (in a name or phrase) which may be pronounced as a word
            - complementary [ref=e2599]:
              - generic [ref=e2600]: Example 3
              - paragraph [ref=e2601]: NOAA is an acronym made from the initial letters of the National Oceanic and Atmospheric Administration in the United States.
        - note [ref=e2602]:
          - heading "Note 3" [level=3] [ref=e2603]
          - paragraph [ref=e2604]: Some companies have adopted what used to be an initialism as their company name. In these cases, the new name of the company is the letters (for example, Ecma) and the word is no longer considered an abbreviation.
      - term [ref=e2605]:
        - term [ref=e2606] [cursor=pointer]: accessibility supported
      - definition [ref=e2607]:
        - paragraph [ref=e2608]:
          - text: supported by users'
          - link "assistive technologies" [ref=e2609] [cursor=pointer]:
            - /url: "#dfn-assistive-technologies"
          - text: as well as the accessibility features in browsers and other
          - link "user agents" [ref=e2610] [cursor=pointer]:
            - /url: "#dfn-user-agents"
        - paragraph [ref=e2611]: "To qualify as an accessibility-supported use of a web content technology (or feature of a technology), both 1 and 2 must be satisfied for a web content technology (or feature):"
        - list [ref=e2612]:
          - listitem [ref=e2613]:
            - paragraph [ref=e2614]:
              - strong [ref=e2615]:
                - text: The way that the
                - link "web content technology" [ref=e2616] [cursor=pointer]:
                  - /url: "#dfn-technologies"
                - text: is used must be supported by users' assistive technology (AT).
              - text: This means that the way that the technology is used has been tested for interoperability with users' assistive technology in the
              - link "human language(s)" [ref=e2617] [cursor=pointer]:
                - /url: "#dfn-human-language-s"
              - text: of the content,
            - paragraph [ref=e2618]:
              - strong [ref=e2619]: AND
          - listitem [ref=e2620]:
            - paragraph [ref=e2621]:
              - strong [ref=e2622]: The web content technology must have accessibility-supported user agents that are available to users.
              - text: "This means that at least one of the following four statements is true:"
            - list [ref=e2623]:
              - listitem [ref=e2624]:
                - paragraph [ref=e2625]: The technology is supported natively in widely-distributed user agents that are also accessibility supported (such as HTML and CSS);
                - paragraph [ref=e2626]:
                  - strong [ref=e2627]: OR
              - listitem [ref=e2628]:
                - paragraph [ref=e2629]: The technology is supported in a widely-distributed plug-in that is also accessibility supported;
                - paragraph [ref=e2630]:
                  - strong [ref=e2631]: OR
              - listitem [ref=e2632]:
                - paragraph [ref=e2633]: The content is available in a closed environment, such as a university or corporate network, where the user agent required by the technology and used by the organization is also accessibility supported;
                - paragraph [ref=e2634]:
                  - strong [ref=e2635]: OR
              - listitem [ref=e2636]:
                - paragraph [ref=e2637]: "The user agent(s) that support the technology are accessibility supported and are available for download or purchase in a way that:"
                - list [ref=e2638]:
                  - listitem [ref=e2639]:
                    - text: does not cost a person with a disability any more than a person without a disability
                    - strong [ref=e2640]: and
                  - listitem [ref=e2641]: is as easy to find and obtain for a person with a disability as it is for a person without disabilities.
        - note [ref=e2642]:
          - heading "Note 1" [level=3] [ref=e2643]
          - paragraph [ref=e2644]:
            - text: The Accessibility Guidelines Working Group and the W3C do not specify which or how much support by assistive technologies there must be for a particular use of a web technology in order for it to be classified as accessibility supported. (See
            - link "Level of Assistive Technology Support Needed for \"Accessibility Support\"" [ref=e2645] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG21/Understanding/conformance#support-level
            - text: .)
        - note [ref=e2646]:
          - heading "Note 2" [level=3] [ref=e2647]
          - paragraph [ref=e2648]:
            - text: Web technologies can be used in ways that are not accessibility supported as long as they are not
            - link "relied upon" [ref=e2649] [cursor=pointer]:
              - /url: "#dfn-relied-upon"
            - text: and the page as a whole meets the conformance requirements, including
            - link "Conformance Requirement 4" [ref=e2650] [cursor=pointer]:
              - /url: "#cc4"
            - text: and
            - link "Conformance Requirement 5" [ref=e2651] [cursor=pointer]:
              - /url: "#cc5"
            - text: .
        - note [ref=e2652]:
          - heading "Note 3" [level=3] [ref=e2653]
          - paragraph [ref=e2654]:
            - text: When a
            - link "web technology" [ref=e2655] [cursor=pointer]:
              - /url: "#dfn-technologies"
            - text: is used in a way that is "accessibility supported," it does not imply that the entire technology or all uses of the technology are supported. Most technologies, including HTML, lack support for at least one feature or use. Pages conform to WCAG only if the uses of the technology that are accessibility supported can be relied upon to meet WCAG requirements.
        - note [ref=e2656]:
          - heading "Note 4" [level=3] [ref=e2657]
          - paragraph [ref=e2658]: When citing web content technologies that have multiple versions, the version(s) supported should be specified.
        - note [ref=e2659]:
          - heading "Note 5" [level=3] [ref=e2660]
          - paragraph [ref=e2661]:
            - text: One way for authors to locate uses of a technology that are accessibility supported would be to consult compilations of uses that are documented to be accessibility supported. (See
            - link "Understanding Accessibility-Supported Web Technology Uses" [ref=e2662] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG21/Understanding/conformance#documented-lists
            - text: .) Authors, companies, technology vendors, or others may document accessibility-supported ways of using web content technologies. However, all ways of using technologies in the documentation would need to meet the definition of accessibility-supported Web content technologies above.
      - term [ref=e2663]:
        - term [ref=e2664] [cursor=pointer]: alternative for time-based media
      - definition [ref=e2665]:
        - paragraph [ref=e2666]: document including correctly sequenced text descriptions of time-based visual and auditory information and providing a means for achieving the outcomes of any time-based interaction
        - note [ref=e2667]:
          - heading "Note" [level=3] [ref=e2668]
          - paragraph [ref=e2669]: A screenplay used to create the synchronized media content would meet this definition only if it was corrected to accurately represent the final synchronized media after editing.
      - term [ref=e2670]:
        - term [ref=e2671] [cursor=pointer]: ambiguous to users in general
      - definition [ref=e2672]:
        - paragraph [ref=e2673]: the purpose cannot be determined from the link and all information of the web page presented to the user simultaneously with the link (i.e., readers without disabilities would not know what a link would do until they activated it)
        - complementary [ref=e2674]:
          - generic [ref=e2675]: Example
          - paragraph [ref=e2676]: The word guava in the following sentence "One of the notable exports is guava" is a link. The link could lead to a definition of guava, a chart listing the quantity of guava exported or a photograph of people harvesting guava. Until the link is activated, all readers are unsure and the person with a disability is not at any disadvantage.
      - term [ref=e2677]:
        - term [ref=e2678] [cursor=pointer]: ASCII art
      - definition [ref=e2679]:
        - paragraph [ref=e2680]: picture created by a spatial arrangement of characters or glyphs (typically from the 95 printable characters defined by ASCII)
      - term [ref=e2681]:
        - term [ref=e2682] [cursor=pointer]: assistive technology
        - text: (as used in this document)
      - definition [ref=e2683]:
        - paragraph [ref=e2684]:
          - text: hardware and/or software that acts as a
          - link "user agent" [ref=e2685] [cursor=pointer]:
            - /url: "#dfn-user-agents"
          - text: ", or along with a mainstream user agent, to provide functionality to meet the requirements of users with disabilities that go beyond those offered by mainstream user agents"
        - note [ref=e2686]:
          - heading "Note 1" [level=3] [ref=e2687]
          - paragraph [ref=e2688]: Functionality provided by assistive technology includes alternative presentations (e.g., as synthesized speech or magnified content), alternative input methods (e.g., voice), additional navigation or orientation mechanisms, and content transformations (e.g., to make tables more accessible).
        - note [ref=e2689]:
          - heading "Note 2" [level=3] [ref=e2690]
          - paragraph [ref=e2691]: Assistive technologies often communicate data and messages with mainstream user agents by using and monitoring APIs.
        - note [ref=e2692]:
          - heading "Note 3" [level=3] [ref=e2693]
          - paragraph [ref=e2694]: The distinction between mainstream user agents and assistive technologies is not absolute. Many mainstream user agents provide some features to assist individuals with disabilities. The basic difference is that mainstream user agents target broad and diverse audiences that usually include people with and without disabilities. Assistive technologies target narrowly defined populations of users with specific disabilities. The assistance provided by an assistive technology is more specific and appropriate to the needs of its target users. The mainstream user agent may provide important functionality to assistive technologies like retrieving web content from program objects or parsing markup into identifiable bundles.
        - complementary [ref=e2695]:
          - generic [ref=e2696]: Example
          - paragraph [ref=e2697]: "Assistive technologies that are important in the context of this document include the following:"
          - list [ref=e2698]:
            - listitem [ref=e2699]: screen magnifiers, and other visual reading assistants, which are used by people with visual, perceptual and physical print disabilities to change text font, size, spacing, color, synchronization with speech, etc. in order to improve the visual readability of rendered text and images;
            - listitem [ref=e2700]: screen readers, which are used by people who are blind to read textual information through synthesized speech or braille;
            - listitem [ref=e2701]: text-to-speech software, which is used by some people with cognitive, language, and learning disabilities to convert text into synthetic speech;
            - listitem [ref=e2702]: speech recognition software, which may be used by people who have some physical disabilities;
            - listitem [ref=e2703]: alternative keyboards, which are used by people with certain physical disabilities to simulate the keyboard (including alternate keyboards that use head pointers, single switches, sip/puff and other special input devices.);
            - listitem [ref=e2704]: alternative pointing devices, which are used by people with certain physical disabilities to simulate mouse pointing and button activations.
      - term [ref=e2705]:
        - term [ref=e2706] [cursor=pointer]: audio
      - definition [ref=e2707]:
        - paragraph [ref=e2708]: the technology of sound reproduction
        - note [ref=e2709]:
          - heading "Note" [level=3] [ref=e2710]
          - paragraph [ref=e2711]: Audio can be created synthetically (including speech synthesis), recorded from real world sounds, or both.
      - term [ref=e2712]:
        - term [ref=e2713] [cursor=pointer]: audio description
      - definition [ref=e2714]:
        - paragraph [ref=e2715]: narration added to the soundtrack to describe important visual details that cannot be understood from the main soundtrack alone
        - note [ref=e2716]:
          - heading "Note 1" [level=3] [ref=e2717]
          - paragraph [ref=e2718]:
            - text: Audio description of
            - link "video" [ref=e2719] [cursor=pointer]:
              - /url: "#dfn-video"
            - text: provides information about actions, characters, scene changes, on-screen text, and other visual content.
        - note [ref=e2720]:
          - heading "Note 2" [level=3] [ref=e2721]
          - paragraph [ref=e2722]:
            - text: In standard audio description, narration is added during existing pauses in dialogue. (See also
            - link "extended audio description" [ref=e2723] [cursor=pointer]:
              - /url: "#dfn-extended-audio-description"
            - text: .)
        - note [ref=e2724]:
          - heading "Note 3" [level=3] [ref=e2725]
          - paragraph [ref=e2726]:
            - text: Where all of the
            - link "video" [ref=e2727] [cursor=pointer]:
              - /url: "#dfn-video"
            - text: information is already provided in existing
            - link "audio" [ref=e2728] [cursor=pointer]:
              - /url: "#dfn-audio"
            - text: ", no additional audio description is necessary."
        - note [ref=e2729]:
          - heading "Note 4" [level=3] [ref=e2730]
          - paragraph [ref=e2731]: Also called "video description" and "descriptive narration."
      - term [ref=e2732]:
        - term [ref=e2733] [cursor=pointer]: audio-only
      - definition [ref=e2734]:
        - paragraph [ref=e2735]:
          - text: a time-based presentation that contains only
          - link "audio" [ref=e2736] [cursor=pointer]:
            - /url: "#dfn-audio"
          - text: (no
          - link "video" [ref=e2737] [cursor=pointer]:
            - /url: "#dfn-video"
          - text: and no interaction)
      - term [ref=e2738]:
        - term [ref=e2739] [cursor=pointer]: blinking
      - definition [ref=e2740]:
        - paragraph [ref=e2741]: switch back and forth between two visual states in a way that is meant to draw attention
        - note [ref=e2742]:
          - heading "Note" [level=3] [ref=e2743]
          - paragraph [ref=e2744]:
            - text: See also
            - link "flash" [ref=e2745] [cursor=pointer]:
              - /url: "#dfn-flashes"
            - text: . It is possible for something to be large enough and blink brightly enough at the right frequency to be also classified as a flash.
      - term [ref=e2746]:
        - term [ref=e2747] [cursor=pointer]: blocks of text
      - definition [ref=e2748]:
        - paragraph [ref=e2749]: more than one sentence of text
      - term [ref=e2750]:
        - term [ref=e2751] [cursor=pointer]: CAPTCHA
      - definition [ref=e2752]:
        - paragraph [ref=e2753]: initialism for "Completely Automated Public Turing test to tell Computers and Humans Apart"
        - note [ref=e2754]:
          - heading "Note 1" [level=3] [ref=e2755]
          - paragraph [ref=e2756]: CAPTCHA tests often involve asking the user to type in text that is displayed in an obscured image or audio file.
        - note [ref=e2757]:
          - heading "Note 2" [level=3] [ref=e2758]
          - paragraph [ref=e2759]: A Turing test is any system of tests designed to differentiate a human from a computer. It is named after famed computer scientist Alan Turing. The term was coined by researchers at Carnegie Mellon University.
      - term [ref=e2760]:
        - term [ref=e2761] [cursor=pointer]: captions
      - definition [ref=e2762]:
        - paragraph [ref=e2763]:
          - text: synchronized visual and/or
          - link "text alternative" [ref=e2764] [cursor=pointer]:
            - /url: "#dfn-text-alternative"
          - text: for both speech and non-speech audio information needed to understand the media content
        - note [ref=e2765]:
          - heading "Note 1" [level=3] [ref=e2766]
          - paragraph [ref=e2767]: Captions are similar to dialogue-only subtitles except captions convey not only the content of spoken dialogue, but also equivalents for non-dialogue audio information needed to understand the program content, including sound effects, music, laughter, speaker identification and location.
        - note [ref=e2768]:
          - heading "Note 2" [level=3] [ref=e2769]
          - paragraph [ref=e2770]: Closed Captions are equivalents that can be turned on and off with some players.
        - note [ref=e2771]:
          - heading "Note 3" [level=3] [ref=e2772]
          - paragraph [ref=e2773]:
            - text: Open Captions are any captions that cannot be turned off. For example, if the captions are visual equivalent
            - link "images of text" [ref=e2774] [cursor=pointer]:
              - /url: "#dfn-images-of-text"
            - text: embedded in
            - link "video" [ref=e2775] [cursor=pointer]:
              - /url: "#dfn-video"
            - text: .
        - note [ref=e2776]:
          - heading "Note 4" [level=3] [ref=e2777]
          - paragraph [ref=e2778]: Captions should not obscure or obstruct relevant information in the video.
        - note [ref=e2779]:
          - heading "Note 5" [level=3] [ref=e2780]
          - paragraph [ref=e2781]: In some countries, captions are called subtitles.
        - note [ref=e2782]:
          - heading "Note 6" [level=3] [ref=e2783]
          - paragraph [ref=e2784]:
            - link "Audio descriptions" [ref=e2785] [cursor=pointer]:
              - /url: "#dfn-audio-descriptions"
            - text: can be, but do not need to be, captioned since they are descriptions of information that is already presented visually.
      - term [ref=e2786]:
        - term [ref=e2787] [cursor=pointer]: changes of context
      - definition [ref=e2788]:
        - paragraph [ref=e2789]: major changes that, if made without user awareness, can disorient users who are not able to view the entire page simultaneously
        - paragraph [ref=e2790]: "Changes in context include changes of:"
        - list [ref=e2791]:
          - listitem [ref=e2792]:
            - link "user agent" [ref=e2793] [cursor=pointer]:
              - /url: "#dfn-user-agents"
            - text: ;
          - listitem [ref=e2794]:
            - link "viewport" [ref=e2795] [cursor=pointer]:
              - /url: "#dfn-viewport"
            - text: ;
          - listitem [ref=e2796]: focus;
          - listitem [ref=e2797]:
            - link "content" [ref=e2798] [cursor=pointer]:
              - /url: "#dfn-content"
            - text: that changes the meaning of the
            - link "web page" [ref=e2799] [cursor=pointer]:
              - /url: "#dfn-web-page-s"
        - note [ref=e2800]:
          - heading "Note" [level=3] [ref=e2801]
          - paragraph [ref=e2802]: A change of content is not always a change of context. Changes in content, such as an expanding outline, dynamic menu, or a tab control do not necessarily change the context, unless they also change one of the above (e.g., focus).
        - complementary [ref=e2803]:
          - generic [ref=e2804]: Example
          - paragraph [ref=e2805]: Opening a new window, moving focus to a different component, going to a new page (including anything that would look to a user as if they had moved to a new page) or significantly re-arranging the content of a page are examples of changes of context.
      - term [ref=e2806]:
        - term [ref=e2807] [cursor=pointer]: cognitive function test
      - definition [ref=e2808]:
        - paragraph [ref=e2809]: New
        - paragraph [ref=e2810]: "A task that requires the user to remember, manipulate, or transcribe information. Examples include, but are not limited to:"
        - list [ref=e2811]:
          - listitem [ref=e2812]: memorization, such as remembering a username, password, set of characters, images, or patterns. The common identifiers name, e-mail, and phone number are not considered cognitive function tests as they are personal to the user and consistent across websites;
          - listitem [ref=e2813]: transcription, such as typing in characters;
          - listitem [ref=e2814]: use of correct spelling;
          - listitem [ref=e2815]: performance of calculations;
          - listitem [ref=e2816]: solving of puzzles.
      - term [ref=e2817]:
        - term [ref=e2818] [cursor=pointer]: conformance
      - definition [ref=e2819]:
        - paragraph [ref=e2820]: satisfying all the requirements of a given standard, guideline or specification
      - term [ref=e2821]:
        - term [ref=e2822] [cursor=pointer]: conforming alternate version
      - definition [ref=e2823]:
        - paragraph [ref=e2824]: version that
        - list [ref=e2825]:
          - listitem [ref=e2826]: conforms at the designated level, and
          - listitem [ref=e2827]:
            - text: provides all of the same information and
            - link "functionality" [ref=e2828] [cursor=pointer]:
              - /url: "#dfn-functionality"
            - text: in the same
            - link "human language" [ref=e2829] [cursor=pointer]:
              - /url: "#dfn-human-language-s"
            - text: ", and"
          - listitem [ref=e2830]: is as up to date as the non-conforming content, and
          - listitem [ref=e2831]:
            - paragraph [ref=e2832]: "for which at least one of the following is true:"
            - list [ref=e2833]:
              - listitem [ref=e2834]:
                - text: the conforming version can be reached from the non-conforming page via an
                - link "accessibility-supported" [ref=e2835] [cursor=pointer]:
                  - /url: "#dfn-accessibility-supported"
                - link "mechanism" [ref=e2836] [cursor=pointer]:
                  - /url: "#dfn-mechanism"
                - text: ", or"
              - listitem [ref=e2837]: the non-conforming version can only be reached from the conforming version, or
              - listitem [ref=e2838]: the non-conforming version can only be reached from a conforming page that also provides a mechanism to reach the conforming version
        - note [ref=e2839]:
          - heading "Note 1" [level=3] [ref=e2840]
          - paragraph [ref=e2841]: In this definition, "can only be reached" means that there is some mechanism, such as a conditional redirect, that prevents a user from "reaching" (loading) the non-conforming page unless the user had just come from the conforming version.
        - note [ref=e2842]:
          - heading "Note 2" [level=3] [ref=e2843]
          - paragraph [ref=e2844]: The alternate version does not need to be matched page for page with the original (e.g., the conforming alternate version may consist of multiple pages).
        - note [ref=e2845]:
          - heading "Note 3" [level=3] [ref=e2846]
          - paragraph [ref=e2847]: If multiple language versions are available, then conforming alternate versions are required for each language offered.
        - note [ref=e2848]:
          - heading "Note 4" [level=3] [ref=e2849]
          - paragraph [ref=e2850]:
            - text: Alternate versions may be provided to accommodate different technology environments or user groups. Each version should be as conformant as possible. One version would need to be fully conformant in order to meet
            - link "conformance requirement 1" [ref=e2851] [cursor=pointer]:
              - /url: "#cc1"
            - text: .
        - note [ref=e2852]:
          - heading "Note 5" [level=3] [ref=e2853]
          - paragraph [ref=e2854]: The conforming alternative version does not need to reside within the scope of conformance, or even on the same website, as long as it is as freely available as the non-conforming version.
        - note [ref=e2855]:
          - heading "Note 6" [level=3] [ref=e2856]
          - paragraph [ref=e2857]:
            - text: Alternate versions should not be confused with
            - link "supplementary content" [ref=e2858] [cursor=pointer]:
              - /url: "#dfn-supplementary-content"
            - text: ", which support the original page and enhance comprehension."
        - note [ref=e2859]:
          - heading "Note 7" [level=3] [ref=e2860]
          - paragraph [ref=e2861]: Setting user preferences within the content to produce a conforming version is an acceptable mechanism for reaching another version as long as the method used to set the preferences is accessibility supported.
        - paragraph [ref=e2862]:
          - text: See
          - link "Understanding Conforming Alternate Versions" [ref=e2863] [cursor=pointer]:
            - /url: https://www.w3.org/WAI/WCAG21/Understanding/conformance#conforming-alt-versions
      - term [ref=e2864]:
        - term [ref=e2865] [cursor=pointer]: content
        - text: (web content)
