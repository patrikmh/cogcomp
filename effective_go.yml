      - term [ref=e2909]:
        - term [ref=e2910] [cursor=pointer]: CSS pixel
      - definition [ref=e2911]:
        - paragraph [ref=e2912]: visual angle of about 0.0213 degrees
        - paragraph [ref=e2913]:
          - text: A CSS pixel is the canonical unit of measure for all lengths and measurements in CSS. This unit is density-independent, and distinct from actual hardware pixels present in a display. User agents and operating systems should ensure that a CSS pixel is set as closely as possible to the
          - link "CSS Values and Units Module Level 3 reference pixel" [ref=e2914] [cursor=pointer]:
