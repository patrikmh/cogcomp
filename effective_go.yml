          - definition [ref=e1379]:
            - paragraph [ref=e1380]: The user is allowed to turn off the time limit before encountering it; or
          - term [ref=e1381]: Adjust
          - definition [ref=e1382]:
            - paragraph [ref=e1383]: The user is allowed to adjust the time limit before encountering it over a wide range that is at least ten times the length of the default setting; or
          - term [ref=e1384]: Extend
          - definition [ref=e1385]:
            - paragraph [ref=e1386]: The user is warned before time expires and given at least 20 seconds to extend the time limit with a simple action (for example, "press the space bar"), and the user is allowed to extend the time limit at least ten times; or
          - term [ref=e1387]: Real-time Exception
          - definition [ref=e1388]:
            - paragraph [ref=e1389]:
              - text: The time limit is a required part of a
              - link "real-time event" [ref=e1390] [cursor=pointer]:
