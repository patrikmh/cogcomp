        - text: ","
        - emphasis [ref=e2351]: NOT RECOMMENDED
        - text: ","
        - emphasis [ref=e2352]: RECOMMENDED
        - text: ","
        - emphasis [ref=e2353]: SHOULD
        - text: ", and"
