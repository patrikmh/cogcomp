        - paragraph [ref=e1184]: (Level AA)
        - paragraph [ref=e1185]: "Content can be presented without loss of information or functionality, and without requiring scrolling in two dimensions for:"
        - list [ref=e1186]:
          - listitem [ref=e1187]:
            - text: Vertical scrolling content at a width equivalent to 320
            - link "CSS pixels" [ref=e1188] [cursor=pointer]:
              - /url: "#dfn-css-pixels"
            - text: ;
          - listitem [ref=e1189]:
            - text: Horizontal scrolling content at a height equivalent to 256
            - link "CSS pixels" [ref=e1190] [cursor=pointer]:
              - /url: "#dfn-css-pixels"
            - text: .
        - paragraph [ref=e1191]: Except for parts of the content which require two-dimensional layout for usage or meaning.
        - note [ref=e1192]:
          - heading "Note 1" [level=5] [ref=e1193]
          - paragraph [ref=e1194]:
            - text: 320 CSS pixels is equivalent to a starting
            - link "viewport" [ref=e1195] [cursor=pointer]:
              - /url: "#dfn-viewport"
            - text: width of 1280 CSS pixels wide at 400% zoom. For web content which is designed to scroll horizontally (e.g., with vertical text), 256 CSS pixels is equivalent to a starting viewport height of 1024 CSS pixels at 400% zoom.
        - note [ref=e1196]:
          - heading "Note 2" [level=5] [ref=e1197]
          - paragraph [ref=e1198]: Examples of content which requires two-dimensional layout are images required for understanding (such as maps and diagrams), video, games, presentations, data tables (not individual cells), and interfaces where it is necessary to keep toolbars in view while manipulating content. It is acceptable to provide two-dimensional scrolling for such parts of the content.
