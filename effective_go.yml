      - text: includes further explanation of the accessibility-supported concept.
    - generic [ref=e2340]:
      - generic [ref=e2341]:
        - heading "5.1 Interpreting Normative Requirements" [level=3] [ref=e2342]
        - link "Permalink for Section 5.1" [ref=e2343] [cursor=pointer]:
          - /url: "#interpreting-normative-requirements"
          - text: §
      - paragraph [ref=e2344]:
        - text: The main content of WCAG 2.2 is
        - link "normative" [ref=e2345] [cursor=pointer]:
          - /url: "#dfn-normative"
        - text: and defines requirements that impact conformance claims. Introductory material, appendices, sections marked as "non-normative", diagrams, examples, and notes are
        - link "informative" [ref=e2346] [cursor=pointer]:
          - /url: "#dfn-informative"
        - text: (non-normative). Non-normative material provides advisory information to help interpret the guidelines but does not create requirements that impact a conformance claim.
      - paragraph [ref=e2347]:
        - text: The key words
        - emphasis [ref=e2348]: MAY
