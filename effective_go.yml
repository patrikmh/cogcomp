          - listitem [ref=e2095]: Self-help option;
          - listitem [ref=e2096]: A fully automated contact mechanism.
        - note [ref=e2097]:
          - heading "Note 1" [level=5] [ref=e2098]
          - paragraph [ref=e2099]: Help mechanisms may be provided directly on the page, or may be provided via a direct link to a different page containing the information.
        - note [ref=e2100]:
          - heading "Note 2" [level=5] [ref=e2101]
          - paragraph [ref=e2102]: For this success criterion, "the same order relative to other page content" can be thought of as how the content is ordered when the page is serialized. The visual position of a help mechanism is likely to be consistent across pages for the same page variation (e.g., CSS break-point). The user can initiate a change, such as changing the page's zoom or orientation, which may trigger a different page variation. This criterion is concerned with relative order across pages displayed in the same page variation (e.g., same zoom level and orientation).
