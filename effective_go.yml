          - heading "Note 1" [level=5] [ref=e1240]
          - paragraph [ref=e1241]: Content is not required to use these text spacing values. The requirement is to ensure that when a user overrides the authored text spacing, content or functionality is not lost.
        - note [ref=e1242]:
          - heading "Note 2" [level=5] [ref=e1243]
