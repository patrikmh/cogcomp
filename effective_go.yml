    - generic [ref=e2332]:
      - heading "5. Conformance" [level=2] [ref=e2333]
      - link "Permalink for Section 5." [ref=e2334] [cursor=pointer]:
        - /url: "#conformance"
        - text: §
    - paragraph [ref=e2335]:
      - text: This section lists requirements for
      - link "conformance" [ref=e2336] [cursor=pointer]:
        - /url: "#dfn-conform"
      - text: to WCAG 2.2. It also gives information about how to make conformance claims, which are optional. Finally, it describes what it means to be
      - link "accessibility supported" [ref=e2337] [cursor=pointer]:
        - /url: "#dfn-accessibility-supported"
