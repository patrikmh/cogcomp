  - generic [ref=e64]:
    - heading "Abstract" [level=2] [ref=e65]
    - paragraph [ref=e66]: Web Content Accessibility Guidelines (WCAG) 2.2 covers a wide range of recommendations for making web content more accessible. Following these guidelines will make content more accessible to a wider range of people with disabilities, including accommodations for blindness and low vision, deafness and hearing loss, limited movement, speech disabilities, photosensitivity, and combinations of these, and some accommodation for learning disabilities and cognitive limitations; but will not address every user need for people with these disabilities. These guidelines address accessibility of web content on any kind of device (including desktops, laptops, kiosks, and mobile devices). Following these guidelines will also often make web content more usable to users in general.
    - paragraph [ref=e67]:
      - text: WCAG 2.2 success criteria are written as testable statements that are not technology-specific. Guidance about satisfying the success criteria in specific technologies, as well as general information about interpreting the success criteria, is provided in separate documents. See
      - link "Web Content Accessibility Guidelines (WCAG) Overview" [ref=e68] [cursor=pointer]:
        - /url: https://www.w3.org/WAI/standards-guidelines/wcag/
      - text: for an introduction and links to WCAG technical and educational material.
    - paragraph [ref=e69]:
      - text: WCAG 2.2 extends
      - link "Web Content Accessibility Guidelines 2.1" [ref=e70] [cursor=pointer]:
        - /url: https://www.w3.org/TR/WCAG21/
      - text: "["
      - link "WCAG21" [ref=e72] [cursor=pointer]:
        - /url: "#bib-wcag21"
      - text: "], which was published as a W3C Recommendation June 2018. Content that conforms to WCAG 2.2 also conforms to WCAG 2.0 and WCAG 2.1. The WG intends that for policies requiring conformance to WCAG 2.0 or WCAG 2.1, WCAG 2.2 can provide an alternate means of conformance. The publication of WCAG 2.2 does not deprecate or supersede WCAG 2.0 or WCAG 2.1. While WCAG 2.0 and WCAG 2.1 remain W3C Recommendations, the W3C advises the use of WCAG 2.2 to maximize future applicability of accessibility efforts. The W3C also encourages use of the most current version of WCAG when developing or updating web accessibility policies."
