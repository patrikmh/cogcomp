              - text: (for example, an auction), and no alternative to the time limit is possible; or
          - term [ref=e1391]: Essential Exception
          - definition [ref=e1392]:
            - paragraph [ref=e1393]:
              - text: The time limit is
              - link "essential" [ref=e1394] [cursor=pointer]:
                - /url: "#dfn-essential"
              - text: and extending it would invalidate the activity; or
          - term [ref=e1395]: 20 Hour Exception
          - definition [ref=e1396]:
            - paragraph [ref=e1397]: The time limit is longer than 20 hours.
        - note [ref=e1398]:
          - heading "Note" [level=5] [ref=e1399]
          - paragraph [ref=e1400]:
            - text: This success criterion helps ensure that users can complete tasks without unexpected changes in content or context that are a result of a time limit. This success criterion should be considered in conjunction with
