      - term [ref=e2878]:
        - term [ref=e2879] [cursor=pointer]: contrast ratio
      - definition [ref=e2880]:
        - paragraph [ref=e2881]: (L1 + 0.05) / (L2 + 0.05), where
        - list [ref=e2882]:
          - listitem [ref=e2883]:
            - text: L1 is the
            - link "relative luminance" [ref=e2884] [cursor=pointer]:
              - /url: "#dfn-relative-luminance"
            - text: of the lighter of the colors, and
          - listitem [ref=e2885]:
            - text: L2 is the
            - link "relative luminance" [ref=e2886] [cursor=pointer]:
              - /url: "#dfn-relative-luminance"
            - text: of the darker of the colors.
        - note [ref=e2887]:
          - heading "Note 1" [level=3] [ref=e2888]
          - paragraph [ref=e2889]: Contrast ratios can range from 1 to 21 (commonly written 1:1 to 21:1).
        - note [ref=e2890]:
          - heading "Note 2" [level=3] [ref=e2891]
          - paragraph [ref=e2892]: Because authors do not have control over user settings as to how text is rendered (for example font smoothing or anti-aliasing), the contrast ratio for text can be evaluated with anti-aliasing turned off.
        - note [ref=e2893]:
          - heading "Note 3" [level=3] [ref=e2894]
          - paragraph [ref=e2895]: For the purpose of Success Criteria 1.4.3 and 1.4.6, contrast is measured with respect to the specified background over which the text is rendered in normal usage. If no background color is specified, then white is assumed.
        - note [ref=e2896]:
          - heading "Note 4" [level=3] [ref=e2897]
          - paragraph [ref=e2898]: Background color is the specified color of content over which the text is to be rendered in normal usage. It is a failure if no background color is specified when the text color is specified, because the user's default background color is unknown and cannot be evaluated for sufficient contrast. For the same reason, it is a failure if no text color is specified when a background color is specified.
        - note [ref=e2899]:
          - heading "Note 5" [level=3] [ref=e2900]
          - paragraph [ref=e2901]: When there is a border around the letter, the border can add contrast and would be used in calculating the contrast between the letter and its background. A narrow border around the letter would be used as the letter. A wide border around the letter that fills in the inner details of the letters acts as a halo and would be considered background.
        - note [ref=e2902]:
          - heading "Note 6" [level=3] [ref=e2903]
          - paragraph [ref=e2904]: WCAG conformance should be evaluated for color pairs specified in the content that an author would expect to appear adjacent in typical presentation. Authors need not consider unusual presentations, such as color changes made by the user agent, except where caused by authors' code.
      - term [ref=e2905]:
