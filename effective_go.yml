        - note [ref=e1431]:
          - heading "Note 3" [level=5] [ref=e1432]
          - paragraph [ref=e1433]: Content that is updated periodically by software or that is streamed to the user agent is not required to preserve or present information that is generated or received between the initiation of the pause and resuming presentation, as this may not be technically possible, and in many situations could be misleading to do so.
        - note [ref=e1434]:
          - heading "Note 4" [level=5] [ref=e1435]
          - paragraph [ref=e1436]: An animation that occurs as part of a preload phase or similar situation can be considered essential if interaction cannot occur during that phase for all users and if not indicating progress could confuse users or cause them to think that content was frozen or broken.
