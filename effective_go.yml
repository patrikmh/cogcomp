  - generic [ref=e530]:
    - generic [ref=e531]:
      - heading "Introduction" [level=2] [ref=e532]
      - link "Permalink for this Section" [ref=e533] [cursor=pointer]:
        - /url: "#intro"
        - text: §
    - paragraph [ref=e534]:
      - emphasis [ref=e535]: This section is non-normative.
    - generic [ref=e536]:
      - generic [ref=e537]:
        - heading "Background on WCAG 2" [level=3] [ref=e538]
        - link "Permalink for this Section" [ref=e539] [cursor=pointer]:
          - /url: "#background-on-wcag-2"
          - text: §
      - paragraph [ref=e540]: Web Content Accessibility Guidelines (WCAG) 2.2 defines how to make web content more accessible to people with disabilities. Accessibility involves a wide range of disabilities, including visual, auditory, physical, speech, cognitive, language, learning, and neurological disabilities. Although these guidelines cover a wide range of issues, they are not able to address the needs of people with all types, degrees, and combinations of disability. These guidelines also make web content more usable by older individuals with changing abilities due to aging and often improve usability for users in general.
      - paragraph [ref=e541]:
        - text: WCAG 2.2 is developed through the
        - link "W3C process" [ref=e542] [cursor=pointer]:
          - /url: https://www.w3.org/WAI/standards-guidelines/w3c-process/
        - text: in cooperation with individuals and organizations around the world, with a goal of providing a shared standard for web content accessibility that meets the needs of individuals, organizations, and governments internationally. WCAG 2.2 builds on WCAG 2.0 [
        - link "WCAG20" [ref=e544] [cursor=pointer]:
          - /url: "#bib-wcag20"
        - text: "] and WCAG 2.1 ["
        - link "WCAG21" [ref=e546] [cursor=pointer]:
          - /url: "#bib-wcag21"
        - text: "], which in turn built on WCAG 1.0 ["
        - link "WAI-WEBCONTENT" [ref=e548] [cursor=pointer]:
          - /url: "#bib-wai-webcontent"
        - text: "] and is designed to apply broadly to different web technologies now and in the future, and to be testable with a combination of automated testing and human evaluation. For an introduction to WCAG, see the"
        - link "Web Content Accessibility Guidelines (WCAG) Overview" [ref=e549] [cursor=pointer]:
          - /url: https://www.w3.org/WAI/standards-guidelines/wcag/
        - text: .
      - paragraph [ref=e550]:
        - text: Significant challenges were encountered in defining additional criteria to address cognitive, language, and learning disabilities, including a short timeline for development as well as challenges in reaching consensus on testability, implementability, and international considerations of proposals. Work will carry on in this area in future versions of WCAG. We encourage authors to refer to our supplemental guidance on
        - link "improving inclusion for people with disabilities, including learning and cognitive disabilities, people with low-vision, and more" [ref=e551] [cursor=pointer]:
          - /url: https://www.w3.org/WAI/standards-guidelines/wcag/#supplement
        - text: .
      - paragraph [ref=e552]: "Web accessibility depends not only on accessible content but also on accessible web browsers and other user agents. Authoring tools also have an important role in web accessibility. For an overview of how these components of web development and interaction work together, see:"
      - list [ref=e553]:
        - listitem [ref=e554]:
          - strong [ref=e555]:
            - link "Essential Components of Web Accessibility" [ref=e556] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/fundamentals/components/
        - listitem [ref=e557]:
          - strong [ref=e558]:
            - link "User Agent Accessibility Guidelines (UAAG) Overview" [ref=e559] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/standards-guidelines/uaag/
        - listitem [ref=e560]:
          - strong [ref=e561]:
            - link "Authoring Tool Accessibility Guidelines (ATAG) Overview" [ref=e562] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/standards-guidelines/atag/
      - paragraph [ref=e563]: Where this document refers to WCAG 2 it is intended to mean any and all versions of WCAG that start with 2.
    - generic [ref=e564]:
      - generic [ref=e565]:
        - heading "WCAG 2 Layers of Guidance" [level=3] [ref=e566]
        - link "Permalink for this Section" [ref=e567] [cursor=pointer]:
          - /url: "#wcag-2-layers-of-guidance"
          - text: §
      - paragraph [ref=e568]:
        - text: The individuals and organizations that use WCAG vary widely and include web designers and developers, policy makers, purchasing agents, teachers, and students. In order to meet the varying needs of this audience, several layers of guidance are provided including overall
        - emphasis [ref=e569]: principles
        - text: ", general"
        - emphasis [ref=e570]: guidelines
        - text: ", testable"
        - emphasis [ref=e571]: success criteria
        - text: and a rich collection of
        - emphasis [ref=e572]: sufficient techniques
        - text: ","
        - emphasis [ref=e573]: advisory techniques
        - text: ", and"
        - emphasis [ref=e574]: documented common failures
        - text: with examples, resource links and code.
      - list [ref=e575]:
        - listitem [ref=e576]:
          - paragraph [ref=e577]:
            - strong [ref=e578]: Principles
            - text: "- At the top are four principles that provide the foundation for web accessibility:"
            - emphasis [ref=e579]: perceivable, operable, understandable, and robust
            - text: . See also
            - link "Understanding the Four Principles of Accessibility" [ref=e580] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG22/Understanding/intro#understanding-the-four-principles-of-accessibility
            - text: .
        - listitem [ref=e581]:
          - paragraph [ref=e582]:
            - strong [ref=e583]: Guidelines
            - text: "- Under the principles are guidelines. The 13 guidelines provide the basic goals that authors should work toward in order to make content more accessible to users with different disabilities. The guidelines are not testable, but provide the framework and overall objectives to help authors understand the success criteria and better implement the techniques."
        - listitem [ref=e584]:
          - paragraph [ref=e585]:
            - strong [ref=e586]: Success Criteria
            - text: "- For each guideline, testable success criteria are provided to allow WCAG 2.2 to be used where requirements and conformance testing are necessary such as in design specification, purchasing, regulation, and contractual agreements. In order to meet the needs of different groups and different situations, three levels of conformance are defined: A (lowest), AA, and AAA (highest). Additional information on WCAG levels can be found in"
            - link "Understanding Levels of Conformance" [ref=e587] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG22/Understanding/conformance#levels
            - text: .
        - listitem [ref=e588]:
          - paragraph [ref=e589]:
            - strong [ref=e590]: Sufficient and Advisory Techniques
            - text: "- For each of the"
            - emphasis [ref=e591]: guidelines
            - text: and
            - emphasis [ref=e592]: success criteria
            - text: in the WCAG 2.2 document itself, the working group has also documented a wide variety of
            - emphasis [ref=e593]: techniques
            - text: ". The techniques are informative and fall into two categories: those that are"
            - emphasis [ref=e594]: sufficient
            - text: for meeting the success criteria and those that are
            - emphasis [ref=e595]: advisory
            - text: . The advisory techniques go beyond what is required by the individual success criteria and allow authors to better address the guidelines. Some advisory techniques address accessibility barriers that are not covered by the testable success criteria. Where common failures are known, these are also documented. See also
            - link "Sufficient and Advisory Techniques in Understanding WCAG 2.2" [ref=e596] [cursor=pointer]:
              - /url: https://www.w3.org/WAI/WCAG22/Understanding/understanding-techniques
            - text: .
      - paragraph [ref=e597]: All of these layers of guidance (principles, guidelines, success criteria, and sufficient and advisory techniques) work together to provide guidance on how to make content more accessible. Authors are encouraged to view and apply all layers that they are able to, including the advisory techniques, in order to best address the needs of the widest possible range of users.
      - paragraph [ref=e598]:
        - text: Note that even content that conforms at the highest level (AAA) will not be accessible to individuals with all types, degrees, or combinations of disability, particularly in the cognitive, language, and learning areas. Authors are encouraged to consider the full range of techniques, including the advisory techniques,
        - link "Making Content Usable for People with Cognitive and Learning Disabilities" [ref=e599] [cursor=pointer]:
          - /url: https://www.w3.org/TR/coga-usable/
        - text: ", as well as to seek relevant advice about current best practice to ensure that web content is accessible, as far as possible, to this community."
        - link "Metadata" [ref=e600] [cursor=pointer]:
          - /url: https://www.w3.org/WAI/WCAG22/Understanding/understanding-metadata
        - text: may assist users in finding content most suitable for their needs.
    - generic [ref=e601]:
      - generic [ref=e602]:
        - heading "WCAG 2.2 Supporting Documents" [level=3] [ref=e603]
        - link "Permalink for this Section" [ref=e604] [cursor=pointer]:
          - /url: "#wcag-2-2-supporting-documents"
          - text: §
      - paragraph [ref=e605]: "The WCAG 2.2 document is designed to meet the needs of those who need a stable, referenceable technical standard. Other documents, called supporting documents, are based on the WCAG 2.2 document and address other important purposes, including the ability to be updated to describe how WCAG would be applied with new technologies. Supporting documents include:"
      - list [ref=e606]:
        - listitem [ref=e607]:
          - paragraph [ref=e608]:
            - strong [ref=e609]:
              - link "How to Meet WCAG 2.2" [ref=e610] [cursor=pointer]:
                - /url: https://www.w3.org/WAI/WCAG22/quickref/
            - text: "- A customizable quick reference to WCAG 2.2 that includes all of the guidelines, success criteria, and techniques for authors to use as they are developing and evaluating web content. This includes content from WCAG 2.0, 2.1, and 2.2, and can be filtered in many ways to help authors focus on relevant content."
        - listitem [ref=e611]:
          - paragraph [ref=e612]:
            - strong [ref=e613]:
              - link "Understanding WCAG 2.2" [ref=e614] [cursor=pointer]:
                - /url: https://www.w3.org/WAI/WCAG22/Understanding/
            - text: "- A guide to understanding and implementing WCAG 2.2. There is a short \"Understanding\" document for each guideline and success criterion in WCAG 2.2 as well as key topics."
        - listitem [ref=e615]:
          - paragraph [ref=e616]:
            - strong [ref=e617]:
              - link "Techniques for WCAG 2.2" [ref=e618] [cursor=pointer]:
                - /url: https://www.w3.org/WAI/WCAG22/Techniques/
            - text: "- A collection of techniques and common failures, each in a separate document that includes a description, examples, code and tests."
        - listitem [ref=e619]:
          - paragraph [ref=e620]:
            - strong [ref=e621]:
              - link "The WCAG 2 Documents" [ref=e622] [cursor=pointer]:
                - /url: https://www.w3.org/WAI/standards-guidelines/wcag/docs/
            - text: "- A brief introduction to the WCAG 2 supporting documents and supplemental guidance."
        - listitem [ref=e623]:
          - paragraph [ref=e624]:
            - strong [ref=e625]:
              - link "What's New in WCAG 2.2" [ref=e626] [cursor=pointer]:
                - /url: https://www.w3.org/WAI/standards-guidelines/wcag/new-in-22/
            - text: introduces the new success criteria with persona quotes that illustrate the accessibility issues.
      - paragraph [ref=e627]:
        - text: See
        - link "Web Content Accessibility Guidelines (WCAG) Overview" [ref=e628] [cursor=pointer]:
          - /url: https://www.w3.org/WAI/standards-guidelines/wcag/
        - text: for a description of the WCAG 2.2 supporting material, including education resources related to WCAG 2. Additional resources covering topics such as the business case for web accessibility, planning implementation to improve the accessibility of websites, and accessibility policies are listed in
        - link "WAI Resources" [ref=e629] [cursor=pointer]:
