        - text: .
    - generic [ref=e630]:
      - generic [ref=e631]:
        - heading "Requirements for WCAG 2.2" [level=3] [ref=e632]
        - link "Permalink for this Section" [ref=e633] [cursor=pointer]:
          - /url: "#requirements-for-wcag-2-2"
          - text: §
      - paragraph [ref=e634]:
        - text: WCAG 2.2 meets a set of
        - link "requirements for WCAG 2.2" [ref=e635] [cursor=pointer]:
          - /url: https://w3c.github.io/wcag/requirements/22/
        - text: which, in turn, inherit requirements from previous WCAG 2 versions. Requirements structure the overall framework of guidelines and ensure backwards compatibility. The Working Group also used a less formal set of acceptance criteria for success criteria, to help ensure success criteria are similar in style and quality to those in WCAG 2.0. These requirements constrained what could be included in WCAG 2.2. This constraint was important to preserve its nature as a dot-release of WCAG 2.
    - generic [ref=e636]:
      - generic [ref=e637]:
        - heading "Comparison with WCAG 2.1" [level=3] [ref=e638]
        - link "Permalink for this Section" [ref=e639] [cursor=pointer]:
          - /url: "#comparison-with-wcag-2-1"
          - text: §
      - paragraph [ref=e640]: "WCAG 2.2 was initiated with the goal to continue the work of WCAG 2.1: Improving accessibility guidance for three major groups: users with cognitive or learning disabilities, users with low vision, and users with disabilities on mobile devices. Many ways to meet these needs were proposed and evaluated, and a set of these were refined by the Working Group. Structural requirements inherited from WCAG 2.0, clarity and impact of proposals, and timeline led to the final set of success criteria included in this version. The Working Group considers that WCAG 2.2 incrementally advances web content accessibility guidance for all these areas, but underscores that not all user needs are met by these guidelines."
      - paragraph [ref=e641]:
        - text: WCAG 2.2 builds on and is backwards compatible with WCAG 2.1, meaning web pages that conform to WCAG 2.2 are at least as accessible as pages that conform to WCAG 2.1. Requirements have been added that build on 2.1 and 2.0. WCAG 2.2 has removed one success criterion,
        - link "4.1.1 Parsing" [ref=e642] [cursor=pointer]:
          - /url: "#parsing"
        - text: . Authors that are required by policy to conform with WCAG 2.0 or 2.1 will be able to update content to WCAG 2.2, but may need to continue to test and report 4.1.1. Authors following more than one version of the guidelines should be aware of the following additions.
      - generic [ref=e643]:
        - generic [ref=e644]:
          - heading "New Features in WCAG 2.2" [level=4] [ref=e645]
          - link "Permalink for this Section" [ref=e646] [cursor=pointer]:
            - /url: "#new-features-in-wcag-2-2"
            - text: §
        - paragraph [ref=e647]: WCAG 2.2 extends WCAG 2.1 by adding new success criteria, definitions to support them, and guidelines to organize the additions. This additive approach helps to make it clear that sites which conform to WCAG 2.2 also conform to WCAG 2.1. The Accessibility Guidelines Working Group recommends that sites adopt WCAG 2.2 as their new conformance target, even if formal obligations mention previous versions, to provide improved accessibility and to anticipate future policy changes.
        - paragraph [ref=e648]: "The following success criteria are new in WCAG 2.2:"
        - list [ref=e649]:
          - listitem [ref=e650]:
            - text: 2.4.11
            - link "Focus Not Obscured (Minimum)" [ref=e651] [cursor=pointer]:
              - /url: "#focus-not-obscured-minimum"
            - text: (AA)
          - listitem [ref=e652]:
            - text: 2.4.12
            - link "Focus Not Obscured (Enhanced)" [ref=e653] [cursor=pointer]:
              - /url: "#focus-not-obscured-enhanced"
            - text: (AAA)
          - listitem [ref=e654]:
            - text: 2.4.13
            - link "Focus Appearance" [ref=e655] [cursor=pointer]:
              - /url: "#focus-appearance"
            - text: (AAA)
          - listitem [ref=e656]:
            - text: 2.5.7
            - link "Dragging Movements" [ref=e657] [cursor=pointer]:
              - /url: "#dragging-movements"
            - text: (AA)
          - listitem [ref=e658]:
            - text: 2.5.8
            - link "Target Size (Minimum)" [ref=e659] [cursor=pointer]:
              - /url: "#target-size-minimum"
            - text: (AA)
          - listitem [ref=e660]:
            - text: 3.2.6
            - link "Consistent Help" [ref=e661] [cursor=pointer]:
              - /url: "#consistent-help"
            - text: (A)
          - listitem [ref=e662]:
            - text: 3.3.7
            - link "Redundant Entry" [ref=e663] [cursor=pointer]:
              - /url: "#redundant-entry"
            - text: (A)
          - listitem [ref=e664]:
            - text: 3.3.8
            - link "Accessible Authentication (Minimum)" [ref=e665] [cursor=pointer]:
              - /url: "#accessible-authentication-minimum"
            - text: (AA)
          - listitem [ref=e666]:
            - text: 3.3.9
            - link "Accessible Authentication (Enhanced)" [ref=e667] [cursor=pointer]:
              - /url: "#accessible-authentication-enhanced"
            - text: (AAA)
        - paragraph [ref=e668]: The new success criteria may reference new terms that have also been added to the glossary and form part of the normative requirements of the success criteria.
        - paragraph [ref=e669]:
          - text: WCAG 2.2 also introduces new sections detailing aspects of the specification which may impact
          - link "privacy" [ref=e670] [cursor=pointer]:
            - /url: "#privacy-summary"
          - text: and
          - link "security" [ref=e671] [cursor=pointer]:
            - /url: "#security-summary"
          - text: .
      - generic [ref=e672]:
        - generic [ref=e673]:
          - heading "Numbering in WCAG 2.2" [level=4] [ref=e674]
          - link "Permalink for this Section" [ref=e675] [cursor=pointer]:
            - /url: "#numbering-in-wcag-2-2"
            - text: §
        - paragraph [ref=e676]:
          - text: In order to avoid confusion for implementers for whom backwards compatibility to WCAG 2 versions is important, new success criteria in WCAG 2.2 have been appended to the end of the set of success criteria within their guideline. This avoids the need to change the section number of success criteria from WCAG 2, which would be caused by inserting new success criteria between existing success criteria in the guideline, but it means success criteria in each guideline are no longer grouped by conformance level. The order of success criteria within each guideline does not imply information about conformance level; only the conformance level indicator (A / AA / AAA) on the success criterion itself indicates this. The
          - link "WCAG 2.2 Quick Reference" [ref=e677] [cursor=pointer]:
            - /url: https://www.w3.org/WAI/WCAG22/quickref/
          - text: will provide a way to view success criteria grouped by conformance level, along with many other filter and sort options.
      - generic [ref=e678]:
        - generic [ref=e679]:
          - heading "Conformance to WCAG 2.2" [level=4] [ref=e680]
          - link "Permalink for this Section" [ref=e681] [cursor=pointer]:
            - /url: "#conformance-to-wcag-2-2"
            - text: §
        - paragraph [ref=e682]: WCAG 2.2 uses the same conformance model as WCAG 2.0. It is intended that sites that conform to WCAG 2.2 also conform to WCAG 2.0 and WCAG 2.1, which means they meet the requirements of any policies that reference WCAG 2.0 or WCAG 2.1, while also better meeting the needs of users on the current Web.
    - generic [ref=e683]:
      - generic [ref=e684]:
        - heading "Later Versions of Accessibility Guidelines" [level=3] [ref=e685]
        - link "Permalink for this Section" [ref=e686] [cursor=pointer]:
          - /url: "#later-versions-of-accessibility-guidelines"
          - text: §
      - paragraph [ref=e687]: In parallel with WCAG 2.2, the Accessibility Guidelines Working Group is developing another major version of accessibility guidelines. The result of this work is expected to be a more substantial restructuring of web accessibility guidance than would be realistic for dot-releases of WCAG 2. The work follows a research-focused, user-centered design methodology to produce the most effective and flexible outcome, including the roles of content authoring, user agent support, and authoring tool support. This is a multi-year effort, so WCAG 2.2 is needed as an interim measure to provide updated web accessibility guidance to reflect changes on the web since the publication of WCAG 2.0. The Working Group might also develop additional interim versions, continuing with WCAG 2.2, on a similar short timeline to provide additional support while the major version is completed.
